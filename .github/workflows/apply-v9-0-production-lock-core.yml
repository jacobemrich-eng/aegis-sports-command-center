name: Apply AEGIS v9.0 Production Lock Core

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Require permanent Production CI
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/aegis-production-ci.yml
          grep -qF "AEGIS Production CI" .github/workflows/aegis-production-ci.yml

      - name: Apply v9.0 production identity and documentation
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json
          import textwrap

          pkg_path=Path("package.json")
          pkg=json.loads(pkg_path.read_text(encoding="utf-8"))
          pkg["version"]="9.0.0"
          pkg_path.write_text(json.dumps(pkg,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")

          lock_path=Path("package-lock.json")
          if lock_path.exists():
              obj=json.loads(lock_path.read_text(encoding="utf-8"))
              obj["version"]="9.0.0"
              if isinstance(obj.get("packages"),dict) and isinstance(obj["packages"].get(""),dict):
                  obj["packages"][""]["version"]="9.0.0"
              lock_path.write_text(json.dumps(obj,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")

          index_path=Path("public/index.html")
          index=index_path.read_text(encoding="utf-8")
          if "v8.9.3 • STATUS SYNC" in index:
              index=index.replace("v8.9.3 • STATUS SYNC","v9.0 • PRODUCTION LOCK",1)
          elif "v9.0 • PRODUCTION LOCK" not in index:
              raise SystemExit("Expected production version pill not found.")
          index=index.replace("?v=8.9.3","?v=9.0.0")
          index_path.write_text(index,encoding="utf-8")

          readme_path=Path("README.md")
          readme=readme_path.read_text(encoding="utf-8")
          readme=readme.replace(
              "# AEGIS Sports Command Center v8.9.3 — Canonical Operations Status",
              "# AEGIS Sports Command Center v9.0 — Production Lock",1)
          readme=readme.replace(
              "**Version taxonomy:** platform release **v8.9.3**;",
              "**Version taxonomy:** platform release **v9.0.0**;",1)
          if "## v9.0 Production Lock" not in readme:
              readme += """

          ## v9.0 Production Lock

          v9.0 freezes the proven production architecture after successful end-to-end scheduler failover, canonical operations-status synchronization, Supabase persistence hardening, and full repository validation.

          Production invariants:
          - Platform release: **v9.0.0**.
          - Frozen betting engine identity: **8.8.0-decision-intelligence**.
          - Canonical betting governance remains **SB101 AEGIS v1.1 — September Daily-Use Freeze**.
          - Automatic release sports remain **MLB and NCAAF**.
          - GitHub AEGIS Autopilot remains the primary scheduler.
          - External heartbeat remains the independent recovery path.
          - Supabase remains the persistent production state store.
          - NFL shadow scheduling remains research/shadow-only.
          - Permanent AEGIS Production CI protects the locked baseline.
          """
          readme_path.write_text(readme,encoding="utf-8")

          docs=Path("docs")
          docs.mkdir(exist_ok=True)

          baseline="""# AEGIS v9.0 Production Baseline

          ## Identity
          - Platform release: **v9.0.0**
          - Betting engine: **8.8.0-decision-intelligence**
          - Governance: **SB101 AEGIS v1.1 — September Daily-Use Freeze**
          - Automatic release sports: **MLB, NCAAF**
          - NFL shadow system: research/shadow-only

          ## Proven reliability
          - Scheduler redundancy is active.
          - External heartbeat authentication and stale-primary detection are proven.
          - True failover was proven end-to-end with the GitHub primary disabled.
          - Backup recovery executed a real Autopilot tick and returned Operations to GREEN.
          - Canonical Operations status is synchronized with confirmed successful Autopilot activity.
          - Supabase statement-timeout hardening is active.
          - Persistent memory advances only after cloud persistence succeeds.
          - Full AEGIS validation passed before production lock.

          ## Architecture freeze
          Preserve unless replaced by a separately tested migration:
          - Render
          - Supabase persistent state
          - GitHub AEGIS Autopilot
          - external heartbeat/recovery
          - Operations Guardian
          - Final Card / Game Lab / Results / Models
          - quota governor
          - release-sport gates
          - Card Lock and audit trail
          - SB101 AEGIS governance

          ## Next milestone
          **v9.1 Data Scale & Provider Independence** will centralize provider access, shared caching, provider failover, and remove the small free-tier daily-credit constraint before public launch.
          """
          (docs/"AEGIS_PRODUCTION_BASELINE.md").write_text(textwrap.dedent(baseline).strip()+"\n",encoding="utf-8")

          runbook="""# AEGIS Production Runbook

          ## Normal state
          - Operations Guardian GREEN during the operating window unless quota protection is legitimately active.
          - Schedulers REDUNDANT.
          - Persistence CONFIRMED.
          - Last Success and Last Successful Run track the same recent successful Autopilot activity.

          ## Primary scheduler failure
          1. Do not press Verify Now during a failover investigation.
          2. Leave Render, Supabase, and the external heartbeat enabled.
          3. The external heartbeat detects a stale GitHub primary and executes the canonical Autopilot tick.
          4. Pass condition: Last Successful Run refreshes while GitHub Autopilot is unavailable.
          5. Restore GitHub Autopilot after confirming recovery.

          ## Persistence timeout
          PostgreSQL `57014` means a write exceeded the statement timeout.
          - Retry transient failures.
          - Reduce only dense market-history retention on timeout retry.
          - Never silently switch production persistence to ephemeral local state.

          ## Quota protection
          The current free-tier governor intentionally pauses nonessential sportsbook refreshes when the daily budget is exhausted.
          This is expected protection, not a production outage.
          Public launch scaling is handled in v9.1.

          ## Security
          - Autopilot and heartbeat endpoints remain bearer-secret protected.
          - PIN/session/provider/Supabase secrets remain server-side.
          - Never put server secrets in browser-delivered assets.

          ## Production workflows
          - `aegis-autopilot.yml` — primary production scheduler
          - `nfl-shadow-scheduler.yml` — NFL shadow/research scheduler
          - `aegis-production-ci.yml` — permanent validation gate
          """
          (docs/"AEGIS_PRODUCTION_RUNBOOK.md").write_text(textwrap.dedent(runbook).strip()+"\n",encoding="utf-8")

          meta={
              "platform_release":"9.0.0",
              "engine_version":"8.8.0-decision-intelligence",
              "governance":"SB101 AEGIS v1.1 — September Daily-Use Freeze",
              "automatic_release_sports":["MLB","NCAAF"],
              "scheduler_failover_verified":True,
              "status_canonicalization_verified":True,
              "persistence_hardening_verified":True,
              "production_lock":True,
              "next_major_milestone":"v9.1 Data Scale & Provider Independence"
          }
          (docs/"AEGIS_PRODUCTION_LOCK.json").write_text(
              json.dumps(meta,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")

          tests=Path("tests")
          if tests.exists():
              for p in tests.rglob("*"):
                  if not p.is_file():
                      continue
                  try:
                      t=p.read_text(encoding="utf-8")
                  except Exception:
                      continue
                  u=t.replace("v8.9.3 • STATUS SYNC","v9.0 • PRODUCTION LOCK")
                  u=u.replace(r"v8\.9\.3 • STATUS SYNC",r"v9\.0 • PRODUCTION LOCK")
                  u=u.replace(r"8\.9\.3",r"9\.0\.0")
                  u=u.replace("8.9.3","9.0.0")
                  if u!=t:
                      p.write_text(u,encoding="utf-8")

          print("v9.0 non-workflow production patch complete.")
          PY

      - name: Validate production invariants
        shell: bash
        run: |
          set -euo pipefail

          node --check server.js
          node --check src/store.js
          node --check src/autopilot.js
          node --check src/heartbeat.js
          node --check src/operations.js
          node --check src/release.js

          test "$(node -p "require('./package.json').version")" = "9.0.0"
          grep -qF "v9.0 • PRODUCTION LOCK" public/index.html
          grep -qF "AEGIS_PERSISTENCE_HARDENING_V1" src/store.js
          grep -qF "const persisted=await supabaseSave(next)" src/store.js
          grep -qF "last_success_source" src/operations.js
          grep -qF "ignoreInFlight:true" server.js
          grep -qF "/api/autopilot/heartbeat" server.js
          grep -qF "/api/autopilot/tick" server.js
          grep -qF "8.8.0-decision-intelligence" server.js src/* 2>/dev/null
          grep -RqsE 'AEGIS_RELEASE_SPORTS|MLB,NCAAF|MLB, NCAAF' render.yaml server.js src public

      - name: Run full AEGIS validation
        run: |
          set -euo pipefail
          npm run check

      - name: Refuse workflow mutations
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- .github/workflows; then
            echo "This lock workflow must not modify .github/workflows."
            git diff -- .github/workflows
            exit 1
          fi
          echo "Workflow mutation guard: PASS"

      - name: Commit v9.0 production lock
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "AEGIS Release Bot"
          git config user.email "aegis-release-bot@users.noreply.github.com"

          git add package.json package-lock.json public/index.html README.md docs tests

          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo "Refusing to commit workflow changes with GITHUB_TOKEN."
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No production-lock changes to commit."
          else
            git commit -m "Lock AEGIS v9.0 production baseline"
            git push origin HEAD:main
          fi

          echo "LOCK_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify live Render v9.0 without sportsbook refresh
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://aegis-sports-command-center.onrender.com"
          TARGET="${LOCK_COMMIT:-$(git rev-parse HEAD)}"
          ok=0

          for i in $(seq 1 24); do
            echo "Live verification attempt $i/24"
            health="$(curl -fsS --max-time 30 "$BASE/api/health" 2>/dev/null || true)"
            home="$(curl -fsS --max-time 30 "$BASE/" 2>/dev/null || true)"

            if [ -n "$health" ] && [ -n "$home" ]; then
              if HEALTH="$health" TARGET="$TARGET" node -e '
                const h=JSON.parse(process.env.HEALTH);
                const release=h.release_version||h.version||h.release?.version;
                const engine=h.engine_version||h.engine?.version;
                const persistent=Boolean(h.storage?.persistent ?? h.persistent_storage ?? h.persistence?.persistent);
                const autopilot=Boolean(h.autopilot?.enabled ?? h.operations?.autopilot_enabled);
                const redundancy=h.operations?.scheduler_redundancy||h.scheduler_redundancy||null;
                if(release!=="9.0.0") process.exit(10);
                if(engine!=="8.8.0-decision-intelligence") process.exit(11);
                if(!persistent) process.exit(12);
                if(!autopilot) process.exit(13);
                if(!redundancy) process.exit(14);
              ' && printf '%s' "$home" | grep -qF "v9.0 • PRODUCTION LOCK"; then
                ok=1
                break
              fi
            fi

            sleep 10
          done

          test "$ok" -eq 1
          echo "Live v9.0 GET-only verification: PASS"

      - name: Tag verified production baseline
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags origin
          current="$(git rev-parse HEAD)"
          existing="$(git rev-list -n 1 v9.0.0 2>/dev/null || true)"

          if [ -n "$existing" ]; then
            test "$existing" = "$current"
            echo "v9.0.0 already points to this commit."
          else
            git tag -a v9.0.0 -m "AEGIS v9.0 Production Lock"
            git push origin v9.0.0
            echo "Created v9.0.0 tag."
          fi

      - name: Production lock summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### AEGIS v9.0 Production Lock"
            echo
            echo "✅ Full AEGIS validation passed"
            echo
            echo "✅ Permanent Production CI was already installed manually"
            echo
            echo "✅ No workflow files were mutated by this Action"
            echo
            echo "✅ Production baseline/runbook added"
            echo
            echo "✅ Engine remains 8.8.0-decision-intelligence"
            echo
            echo "✅ Automatic release sports remain MLB/NCAAF"
            echo
            echo "✅ Live Render verified with GET-only checks"
            echo
            echo "✅ Production baseline tagged v9.0.0"
            echo
            echo "Next: v9.1 Data Scale & Provider Independence"
          } >> "$GITHUB_STEP_SUMMARY"
