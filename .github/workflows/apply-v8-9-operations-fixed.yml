      - name: Integrate v8.9 into AEGIS
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/apply-v89.py <<'EOF_PATCH_V89'
          from pathlib import Path
          import json
          import re

          ROOT=Path('.')
          APP_VERSION='8.9.0'

          pkg_path=ROOT/'package.json'
          pkg=json.loads(pkg_path.read_text(encoding='utf-8'))
          if pkg.get('version')!='8.8.0':
              raise SystemExit(f"Expected v8.8.0 before v8.9; found {pkg.get('version')!r}. Refusing unsafe patch.")
          pkg['version']=APP_VERSION
          check=pkg.get('scripts',{}).get('check','')
          if 'node --check src/operations.js' not in check:
              check=check.replace('node --check src/release.js','node --check src/release.js && node --check src/operations.js')
          if 'node --check public/app-v8_9.js' not in check:
              check=check.replace('node --check public/app-v8_6.js','node --check public/app-v8_6.js && node --check public/app-v8_9.js')
          if 'node --check src/operations.js' not in check or 'node --check public/app-v8_9.js' not in check:
              raise SystemExit('Unable to add v8.9 syntax gates safely.')
          pkg['scripts']['check']=check
          pkg_path.write_text(json.dumps(pkg,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          server_path=ROOT/'server.js'
          server=server_path.read_text(encoding='utf-8')
          if "require('./src/operations')" not in server:
              anchor="const release = require('./src/release');"
              if anchor not in server:
                  raise SystemExit('server release import anchor missing')
              server=server.replace(anchor,anchor+"\nconst operations = require('./src/operations');",1)

          health_start="if(req.method==='GET'&&u.pathname==='/api/health'){"
          login_start="if(req.method==='POST'&&u.pathname==='/api/login'){"
          i=server.find(health_start)
          j=server.find(login_start,i+1)
          if i<0 or j<0:
              raise SystemExit('server health/login route anchors missing')
          block=server[i:j]
          if 'operations:ops' not in block:
              block,n=re.subn(
                  r'auto=await safeStatus\(\);',
                  """auto=await safeStatus();
                        const ops=operations.evaluate({
                          auto,
                          storage,
                          config:{
                            autopilotEnabled:auto.enabled,
                            dailyBudget:autopilot.config.DAILY_BUDGET,
                            monthlyBudget:autopilot.config.MONTHLY_BUDGET,
                            scheduleMinutes:15,
                            autoLockMinutes:Number(process.env.AEGIS_AUTO_LOCK_MINUTES||30),
                            gradeDelayHours:Number(process.env.AEGIS_GRADE_DELAY_HOURS||2),
                            releaseSports:autopilot.config.RELEASE_SPORTS
                          },
                          production:process.env.NODE_ENV==='production',
                          uptimeSeconds:process.uptime()
                        });""",
                  block,
                  count=1
              )
              if n!=1:
                  raise SystemExit('health safeStatus anchor did not patch exactly once')
              if '...health,' not in block:
                  raise SystemExit('health response spread anchor missing')
              block=block.replace('...health,','...health,\n                operations:ops,',1)
          server=server[:i]+block+server[j:]

          if "/api/operations/status" not in server:
              route="""            if(req.method==='GET'&&u.pathname==='/api/operations/status'){
                        const c=engine.config(),
                              storage=await store.health(),
                              auto=await safeStatus();

                        const ops=operations.evaluate({
                          auto,
                          storage,
                          config:{
                            autopilotEnabled:auto.enabled,
                            dailyBudget:autopilot.config.DAILY_BUDGET,
                            monthlyBudget:autopilot.config.MONTHLY_BUDGET,
                            scheduleMinutes:15,
                            autoLockMinutes:Number(process.env.AEGIS_AUTO_LOCK_MINUTES||30),
                            gradeDelayHours:Number(process.env.AEGIS_GRADE_DELAY_HOURS||2),
                            releaseSports:autopilot.config.RELEASE_SPORTS,
                            oddsQuotaReserve:c.oddsQuotaReserve
                          },
                          production:process.env.NODE_ENV==='production',
                          uptimeSeconds:process.uptime()
                        });

                        return send(res,200,{
                          ok:ops.status!=='RED',
                          release_version:release.APP_VERSION,
                          engine_version:engine.VERSION,
                          operations:ops
                        });
                      }
          """
              pos=server.find(login_start)
              if pos<0:
                  raise SystemExit('login route insertion anchor missing')
              server=server[:pos]+route+server[pos:]
          server_path.write_text(server,encoding='utf-8')

          index_path=ROOT/'public'/'index.html'
          html=index_path.read_text(encoding='utf-8')
          html,n=re.subn(r'<span class="versionpill">.*?</span>','<span class="versionpill">v8.9 • AUTONOMOUS OPS</span>',html,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('index version pill missing')
          css_tag='<link rel="stylesheet" href="/visual-v8_9.css?v=8.9.0">'
          if css_tag not in html:
              if '</head>' not in html:
                  raise SystemExit('index head close missing')
              html=html.replace('</head>',css_tag+'\n</head>',1)
          js_tag='<script src="/app-v8_9.js?v=8.9.0" defer></script>'
          if js_tag not in html:
              if '</body>' not in html:
                  raise SystemExit('index body close missing')
              html=html.replace('</body>',js_tag+'\n</body>',1)
          index_path.write_text(html,encoding='utf-8')

          health_path=ROOT/'tests'/'health-contract.test.js'
          health=health_path.read_text(encoding='utf-8')
          if '8.8.0' not in health:
