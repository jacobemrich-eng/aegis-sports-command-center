name: Apply AEGIS NFL v1.0 Feature Ablation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feature-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyarrow requests scikit-learn

      - name: Rebuild clean v0.8 pregame rows
        run: |
          python modeling/nfl/aegis_nfl_v08_pipeline.py --start 2021 --end 2025 --cache-dir data/nflverse --out-dir data/nfl_walkforward_v08

      - name: Install NFL v1.0 feature lab
        shell: bash
        run: |
          mkdir -p modeling/nfl public/data data/nfl_walkforward_v10
          echo '' | base64 -d > modeling/nfl/aegis_nfl_v10_ablation.py
          echo '' | base64 -d > public/nfl-v10-feature-lab.html
          echo '' | base64 -d > modeling/nfl/README_v1.0.md
          python -m py_compile modeling/nfl/aegis_nfl_v10_ablation.py

      - name: Run development ablation and untouched 2025 holdout
        run: |
          python modeling/nfl/aegis_nfl_v10_ablation.py             --input-dir data/nfl_walkforward_v08             --start 2021             --end 2025             --out-dir data/nfl_walkforward_v10

      - name: Run v0.9 calibrator on v1.0 predictions
        run: |
          python modeling/nfl/aegis_nfl_v09_market_calibrator.py             --predictions data/nfl_walkforward_v10/nfl_v10_predictions.csv             --out-dir data/nfl_walkforward_v10/v09_postmodel

      - name: Build post-market 2025 comparison
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          import numpy as np

          v10=json.loads(Path("data/nfl_walkforward_v10/nfl_v10_report.json").read_text())
          p=pd.read_csv("data/nfl_walkforward_v10/v09_postmodel/nfl_v09_predictions.csv")
          p=p[p["season"].eq(2025)].copy()

          def mae(y,x):
              y=np.asarray(y,float); x=np.asarray(x,float)
              m=np.isfinite(y)&np.isfinite(x)
              return float(np.mean(np.abs(y[m]-x[m])))
          def brier(y,x):
              y=np.asarray(y,float); x=np.asarray(x,float)
              m=np.isfinite(y)&np.isfinite(x)
              return float(np.mean((y[m]-x[m])**2))

          post={
            "n":int(len(p)),
            "margin_mae":mae(p.home_margin,p.v09_margin_pred),
            "total_mae":mae(p.game_total,p.v09_total_pred),
            "cover_brier":brier(p.home_cover,p.v09_cover_prob),
            "over_brier":brier(p.over_result,p.v09_over_prob)
          }
          v10["untouched_2025"]["v10_plus_v09_postmarket"]=post
          Path("data/nfl_walkforward_v10/nfl_v10_report.json").write_text(json.dumps(v10,indent=2))
          Path("data/nfl_walkforward_v10/nfl_v10_shadow_status.json").write_text(json.dumps({
              "sport":"NFL",
              "engine_version":"NFL_v1.0_FEATURE_ABLATION",
              "mode":"SHADOW",
              "report":v10
          },indent=2))
          PY

      - name: Publish v1.0 results
        run: |
          cp data/nfl_walkforward_v10/nfl_v10_shadow_status.json public/data/nfl-v10-shadow-status.json
          cp data/nfl_walkforward_v10/nfl_v10_report.json public/data/nfl-v10-report.json
          cp data/nfl_walkforward_v10/nfl_v10_family_ablation.csv public/data/nfl-v10-family-ablation.csv

      - name: Add Actions summary
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path("data/nfl_walkforward_v10/nfl_v10_report.json").read_text())
          u=r["untouched_2025"]
          b=u["v08_internal_champion"]
          c=u["v10_internal_challenger"]
          m=u["market_challenger"]
          pm=u.get("v10_plus_v09_postmarket",{})
          lines=[
            "# AEGIS NFL v1.0 Feature Ablation",
            f"- Promotion gate: **{u['promotion_gate']['decision']}**",
            f"- Features: **{r['baseline_feature_count']} → {r['selected_feature_count']}**",
            f"- Removed groups: **{', '.join(r['removed_groups']) if r['removed_groups'] else 'None'}**",
            f"- 2025 margin MAE: v1.0 **{c['margin_mae']:.3f}** | v0.8 **{b['margin_mae']:.3f}** | market **{m['margin_mae']:.3f}**",
            f"- 2025 total MAE: v1.0 **{c['total_mae']:.3f}** | v0.8 **{b['total_mae']:.3f}** | market **{m['total_mae']:.3f}**",
            f"- 2025 cover Brier: v1.0 **{c['cover_brier']:.4f}** | v0.8 **{b['cover_brier']:.4f}**",
            f"- Post-market 2025 margin MAE: **{pm.get('margin_mae','—')}**",
            f"- Selected hyperparameters: **{r['selected_hyperparameters']}**",
            "- 2025 was untouched during feature selection and tuning.",
            "- Production release remains **DISABLED**."
          ]
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines)+"\n")
          PY

      - name: Run repository checks
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; fi
          if node -e "const p=require('./package.json'); process.exit(p.scripts&&p.scripts.check?0:1)" 2>/dev/null; then npm run check; fi

      - name: Commit tested NFL v1.0 feature lab
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modeling/nfl/aegis_nfl_v10_ablation.py                   modeling/nfl/README_v1.0.md                   public/nfl-v10-feature-lab.html                   public/data/nfl-v10-shadow-status.json                   public/data/nfl-v10-report.json                   public/data/nfl-v10-family-ablation.csv
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add AEGIS NFL v1.0 feature ablation and calibration"
            git push origin HEAD:main
          fi

      - name: Upload full v1.0 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-nfl-v10-feature-ablation
          path: |
            data/nfl_walkforward_v10/**
            public/data/nfl-v10-*
          retention-days: 30
