name: Apply AEGIS NFL v0.8 Hygiene + Residual Audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-and-recalibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyarrow requests scikit-learn

      - name: Install AEGIS NFL v0.8 modules
        shell: bash
        run: |
          mkdir -p modeling/nfl public/data
          echo '' | base64 -d > modeling/nfl/aegis_nfl_walkforward_v08.py
          echo '' | base64 -d > modeling/nfl/aegis_nfl_v08_audit.py
          echo '' | base64 -d > modeling/nfl/aegis_nfl_v08_pipeline.py
          python -m py_compile modeling/nfl/aegis_nfl_walkforward_v08.py
          python -m py_compile modeling/nfl/aegis_nfl_v08_audit.py
          python -m py_compile modeling/nfl/aegis_nfl_v08_pipeline.py

      - name: Run clean 2021-2025 real walk-forward
        run: |
          python modeling/nfl/aegis_nfl_v08_pipeline.py --start 2021 --end 2025 --cache-dir data/nflverse --out-dir data/nfl_walkforward_v08

      - name: Publish v0.8 audit data
        shell: bash
        run: |
          cp data/nfl_walkforward_v08/nfl_v08_shadow_status.json public/data/nfl-v08-shadow-status.json
          cp data/nfl_walkforward_v08/audit/nfl_v08_audit.json public/data/nfl-v08-audit.json
          cp data/nfl_walkforward_v08/audit/nfl_v08_segment_audit.csv public/data/nfl-v08-segments.csv
          cp data/nfl_walkforward_v08/audit/nfl_v08_directional_diagnostic.csv public/data/nfl-v08-directional.csv
          echo '' | base64 -d > public/nfl-v08-audit.html

      - name: Compare v0.7 and v0.8
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/compare_v08.py
          python /tmp/compare_v08.py

      - name: Add GitHub Actions summary
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/summary_v08.py
          python /tmp/summary_v08.py

      - name: Run repository checks
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          fi
          if node -e "const p=require('./package.json'); process.exit(p.scripts&&p.scripts.check?0:1)" 2>/dev/null; then
            npm run check
          fi

      - name: Commit tested NFL v0.8 audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modeling/nfl/aegis_nfl_walkforward_v08.py modeling/nfl/aegis_nfl_v08_audit.py modeling/nfl/aegis_nfl_v08_pipeline.py public/nfl-v08-audit.html public/data/nfl-v08-shadow-status.json public/data/nfl-v08-audit.json public/data/nfl-v08-segments.csv public/data/nfl-v08-directional.csv public/data/nfl-v08-comparison.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add AEGIS NFL v0.8 hygiene and residual audit"
            git push origin HEAD:main
          fi

      - name: Upload full v0.8 calibration artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-nfl-v08-hygiene-audit
          path: |
            data/nfl_walkforward_v08/**
            public/data/nfl-v08-*.json
            public/data/nfl-v08-*.csv
          retention-days: 30
