name: Apply AEGIS v8.3.2 Stability Hotfix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply v8.3.2 stability hotfix
        run: python scripts/apply-v8-1-visual.py

      - name: Validate JavaScript
        run: node --check public/app-v8_3_2.js

      - name: Run full AEGIS checks
        run: npm run check

      - name: Commit tested hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/app-v8_3_2.js
          git diff --cached --check
          git commit -m "Stabilize AEGIS Final Card status panel"
          git push origin HEAD:main
