name: Apply AEGIS v8.7 Stability Pass

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply v8.7 stability patch
        run: python scripts/apply-v8-1-visual.py

      - name: Run full AEGIS validation
        run: npm run check

      - name: Commit tested v8.7 changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git diff --cached --check

          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Apply AEGIS v8.7 stability and integrity pass"
            git push origin HEAD:main
          fi
