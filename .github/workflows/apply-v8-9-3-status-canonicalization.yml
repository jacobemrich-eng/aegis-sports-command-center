name: Apply AEGIS v8.9.3 Status Canonicalization

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aegis-v8-9-3-status-canonicalization
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Patch canonical Operations success timestamp
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import json

          pkg_path=Path('package.json')
          pkg=json.loads(pkg_path.read_text(encoding='utf-8'))
          if pkg.get('version')!='8.9.2':
              raise SystemExit(f"Expected v8.9.2 before v8.9.3; found {pkg.get('version')!r}. Refusing unsafe patch.")
          pkg['version']='8.9.3'
          pkg_path.write_text(json.dumps(pkg,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          ops_path=Path('src/operations.js')
          ops=ops_path.read_text(encoding='utf-8')

          helper_anchor="""function evaluate({
          """
          if ops.count(helper_anchor)!=1:
              raise SystemExit(f'expected exactly one Operations evaluate() anchor, found {ops.count(helper_anchor)}')

          helper=r'''function timestampMs(value){
            if(value===null||value===undefined||value==='')return null;
            let ms=null;
            if(typeof value==='number'){
              ms=value<1e12?value*1000:value;
            }else{
              ms=new Date(value).getTime();
            }
            return Number.isFinite(ms)?ms:null;
          }

          function canonicalSuccess(auto={},nowMs=Date.now()){
            const candidates=[];
            const seen=new Set();
            const futureAllowanceMs=5*60000;

            function add(value,source){
              const ms=timestampMs(value);
              if(ms===null||ms>nowMs+futureAllowanceMs)return;
              candidates.push({ms,source});
            }

            [
              ['auto.last_success_at',auto.last_success_at],
              ['auto.lastSuccessAt',auto.lastSuccessAt],
              ['auto.last_successful_run_at',auto.last_successful_run_at],
              ['auto.lastSuccessfulRunAt',auto.lastSuccessfulRunAt],
              ['auto.last_successful_tick_at',auto.last_successful_tick_at],
              ['auto.lastSuccessfulTickAt',auto.lastSuccessfulTickAt]
            ].forEach(([source,value])=>add(value,source));

            const topLevelFailure=Boolean(auto.last_error||auto.lastError);
            if(!topLevelFailure){
              [
                ['auto.last_run_at',auto.last_run_at],
                ['auto.lastRunAt',auto.lastRunAt],
                ['auto.last_tick_at',auto.last_tick_at],
                ['auto.lastTickAt',auto.lastTickAt],
                ['auto.last_completed_at',auto.last_completed_at],
                ['auto.lastCompletedAt',auto.lastCompletedAt]
              ].forEach(([source,value])=>add(value,source));
            }

            function walk(value,path='auto',depth=0){
              if(value===null||value===undefined||depth>4)return;
              if(typeof value!=='object')return;
              if(seen.has(value))return;
              seen.add(value);

              if(Array.isArray(value)){
                for(let i=0;i<Math.min(value.length,50);i++)walk(value[i],`${path}[${i}]`,depth+1);
                return;
              }

              const entries=Object.entries(value);

              for(const [key,item] of entries){
                if(item===null||item===undefined||typeof item==='object')continue;
                const normalized=String(key).toLowerCase().replace(/[^a-z0-9]/g,'');
                if(
                  normalized.includes('success')&&
                  (normalized.includes('at')||normalized.includes('time')||normalized.includes('date'))
                ){
                  add(item,`${path}.${key}`);
                }
              }

              const state=String(
                value.status??value.state??value.conclusion??value.result??''
              ).trim().toLowerCase();

              const failed=
                value.ok===false||
                value.success===false||
                Boolean(value.error||value.last_error||value.lastError)||
                ['error','failed','failure','cancelled','canceled'].includes(state);

              const successful=
                !failed&&(
                  value.ok===true||
                  value.success===true||
                  ['success','succeeded','ok','completed','complete','passed'].includes(state)
                );

              const operationalPath=/(run|tick|autopilot|history|recent|sport)/i.test(path);

              if(operationalPath&&!failed){
                const runKeys=[
                  'last_run_at','lastRunAt','run_at','runAt',
                  'finished_at','finishedAt','completed_at','completedAt',
                  'ended_at','endedAt'
                ];
                for(const key of runKeys){
                  if(Object.prototype.hasOwnProperty.call(value,key)){
                    if(successful||key.startsWith('last_')||key.startsWith('lastR')){
                      add(value[key],`${path}.${key}`);
                    }
                  }
                }

                if(successful){
                  for(const key of ['at','timestamp','time','updated_at','updatedAt']){
                    if(Object.prototype.hasOwnProperty.call(value,key)){
                      add(value[key],`${path}.${key}`);
                    }
                  }
                }
              }

              for(const [key,item] of entries){
                if(item&&typeof item==='object')walk(item,`${path}.${key}`,depth+1);
              }
            }

            walk(auto);

            if(!candidates.length)return {at:null,source:null};
            candidates.sort((a,b)=>b.ms-a.ms);
            return {
              at:new Date(candidates[0].ms).toISOString(),
              source:candidates[0].source
            };
          }

          '''

          if 'function canonicalSuccess(' in ops:
              raise SystemExit('canonicalSuccess already exists unexpectedly')
          ops=ops.replace(helper_anchor,helper+helper_anchor,1)

          old_success="const lastSuccess=auto.last_success_at||auto.lastSuccessAt||null;"
          new_success="""const successInfo=canonicalSuccess(auto,nowMs);
            const lastSuccess=successInfo.at;"""
          if ops.count(old_success)!=1:
              raise SystemExit(f'expected exactly one legacy lastSuccess assignment, found {ops.count(old_success)}')
          ops=ops.replace(old_success,new_success,1)

          return_anchor="""      last_success_at:lastSuccess,
              last_success_age_minutes:lastAge===null?null:+lastAge.toFixed(1),
          """
          return_new="""      last_success_at:lastSuccess,
              last_success_source:successInfo.source,
              last_success_age_minutes:lastAge===null?null:+lastAge.toFixed(1),
          """
          if ops.count(return_anchor)!=1:
              raise SystemExit(f'expected exactly one Operations return timestamp block, found {ops.count(return_anchor)}')
          ops=ops.replace(return_anchor,return_new,1)
          ops_path.write_text(ops,encoding='utf-8')

          tests_path=Path('tests/operations.test.js')
          tests=tests_path.read_text(encoding='utf-8')

          marker="canonical status prefers the newest successful Autopilot activity"
          if marker in tests:
              raise SystemExit('v8.9.3 canonical-status tests already exist unexpectedly')

          tests += r'''

          test('canonical status prefers the newest successful Autopilot activity',()=>{
            const x=operations.evaluate({
              ...good,
              auto:{
                enabled:true,
                last_success_at:isoAgo(194),
                last_run_at:isoAgo(2),
                last_error:null,
                usage:{today:15,month:44}
              }
            });
            assert.equal(x.status,'GREEN');
            assert.ok(x.last_success_age_minutes>=1&&x.last_success_age_minutes<=3);
            assert.equal(x.last_success_source,'auto.last_run_at');
          });

          test('canonical status discovers a nested successful run record',()=>{
            const x=operations.evaluate({
              ...good,
              auto:{
                enabled:true,
                last_success_at:isoAgo(194),
                last_error:null,
                runs:[
                  {sport:'baseball_mlb',status:'success',finished_at:isoAgo(3)}
                ]
              }
            });
            assert.equal(x.status,'GREEN');
            assert.ok(x.last_success_age_minutes>=2&&x.last_success_age_minutes<=4);
            assert.match(String(x.last_success_source),/runs\[0\]\.finished_at/);
          });

          test('failed newer activity cannot falsely refresh canonical success',()=>{
            const x=operations.evaluate({
              ...good,
              auto:{
                enabled:true,
                last_success_at:isoAgo(48),
                last_error:'latest run failed',
                last_run_at:isoAgo(1),
                runs:[
                  {status:'failed',finished_at:isoAgo(1),error:'failure'}
                ]
              }
            });
            assert.ok(x.last_success_age_minutes>=47&&x.last_success_age_minutes<=49);
            assert.equal(x.last_success_source,'auto.last_success_at');
            assert.notEqual(x.status,'GREEN');
          });
          '''

          old_pkg="assert.equal(pkg.version,'8.9.2');"
          new_pkg="assert.equal(pkg.version,'8.9.3');"
          if tests.count(old_pkg)!=1:
              raise SystemExit(f'expected exactly one v8.9.2 package assertion, found {tests.count(old_pkg)}')
          tests=tests.replace(old_pkg,new_pkg,1)

          old_ops_pill=r'v8\.9\.2 • TRUE FAILOVER'
          new_ops_pill=r'v8\.9\.3 • STATUS SYNC'
          if old_ops_pill not in tests:
              raise SystemExit('v8.9.2 Operations UI pill assertion missing')
          tests=tests.replace(old_ops_pill,new_ops_pill)
          tests=tests.replace(r'/app-v8_9\.js\?v=8\.9\.2',r'/app-v8_9\.js\?v=8\.9\.3')
          tests=tests.replace(r'/visual-v8_9\.css\?v=8\.9\.2',r'/visual-v8_9\.css\?v=8\.9\.3')
          tests_path.write_text(tests,encoding='utf-8')

          hb_test_path=Path('tests/heartbeat.test.js')
          hb_tests=hb_test_path.read_text(encoding='utf-8')
          old_hb_pill=r'v8\.9\.2 • TRUE FAILOVER'
          new_hb_pill=r'v8\.9\.3 • STATUS SYNC'
          if old_hb_pill not in hb_tests:
              raise SystemExit('v8.9.2 heartbeat UI pill assertion missing')
          hb_tests=hb_tests.replace(old_hb_pill,new_hb_pill)
          hb_test_path.write_text(hb_tests,encoding='utf-8')

          index_path=Path('public/index.html')
          html=index_path.read_text(encoding='utf-8')
          if 'v8.9.2 • TRUE FAILOVER' not in html:
              raise SystemExit('v8.9.2 UI pill anchor missing')
          html=html.replace('v8.9.2 • TRUE FAILOVER','v8.9.3 • STATUS SYNC',1)
          html=html.replace('/app-v8_9.js?v=8.9.2','/app-v8_9.js?v=8.9.3',1)
          html=html.replace('/visual-v8_9.css?v=8.9.2','/visual-v8_9.css?v=8.9.3',1)
          index_path.write_text(html,encoding='utf-8')

          health_path=Path('tests/health-contract.test.js')
          health=health_path.read_text(encoding='utf-8')
          if '8.9.2' not in health:
              raise SystemExit('v8.9.2 health version anchor missing')
          health=health.replace('8.9.2','8.9.3')
          health_path.write_text(health,encoding='utf-8')

          front_path=Path('tests/frontend-stability.test.js')
          front=front_path.read_text(encoding='utf-8')
          if r'v8\.9\.2 • TRUE FAILOVER' not in front:
              raise SystemExit('v8.9.2 frontend pill anchor missing')
          front=front.replace(r'v8\.9\.2 • TRUE FAILOVER',r'v8\.9\.3 • STATUS SYNC')
          front=front.replace('v8.9.2 true-failover operations shell','v8.9.3 canonical-status operations shell')
          front_path.write_text(front,encoding='utf-8')

          readme_path=Path('README.md')
          readme=readme_path.read_text(encoding='utf-8')
          readme=readme.replace(
              '# AEGIS Sports Command Center v8.9.2 — True Failover & Hands-Off Recovery',
              '# AEGIS Sports Command Center v8.9.3 — Canonical Operations Status',
              1
          )
          readme=readme.replace('platform release **v8.9.2**','platform release **v8.9.3**',1)
          if '## v8.9.3 Status Canonicalization' not in readme:
              readme += """

          ## v8.9.3 Status Canonicalization

          - Reconciles Operations Guardian with the newest successful Autopilot activity instead of trusting a stale legacy success field when fresher successful run evidence exists.
          - A newer successful run/tick may refresh canonical scheduler health; a failed newer run cannot falsely mark the system fresh.
          - Adds `last_success_source` to the Operations contract for auditability.
          - Does not modify scheduler cadence, backup heartbeat behavior, sportsbook quota policy, release sports, betting models, or SB101 AEGIS governance.
          - The v8.8 Decision Intelligence engine remains frozen at `8.8.0-decision-intelligence`.
          """
          readme_path.write_text(readme,encoding='utf-8')

          print('v8.9.3 canonical Operations status staged.')
          PY

      - name: Run full AEGIS validation
        run: npm run check

      - name: Commit tested v8.9.3 changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            package.json \
            src/operations.js \
            public/index.html \
            tests/operations.test.js \
            tests/heartbeat.test.js \
            tests/health-contract.test.js \
            tests/frontend-stability.test.js \
            README.md

          git diff --cached --check

          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Apply AEGIS v8.9.3 canonical operations status"
            git push origin HEAD:main
          fi

      - name: Verify live Render v8.9.3 without sportsbook refresh
        shell: bash
        env:
          BASE_URL: https://aegis-sports-command-center.onrender.com
        run: |
          set -euo pipefail

          EXPECTED_SHA="$(git rev-parse HEAD)"
          EXPECTED_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_ENGINE="8.8.0-decision-intelligence"

          for attempt in $(seq 1 24); do
            HEALTH="$(curl -fsS --max-time 20 "$BASE_URL/api/health" || true)"
            HOME="$(curl -fsS --max-time 20 "$BASE_URL/" || true)"

            META="$(
              printf '%s' "$HEALTH" |
              node -e "
                let s='';
                process.stdin.on('data',d=>s+=d).on('end',()=>{
                  try{
                    const j=JSON.parse(s);
                    const ops=j.operations||{};
                    const age=Number(ops.last_success_age_minutes);
                    console.log([
                      j.release_version||'',
                      j.engine_version||'',
                      j.deploy?.git_commit||'',
                      j.persistent_storage===true?'true':'false',
                      j.autopilot_enabled===true?'true':'false',
                      j.scheduler_redundancy&&typeof j.scheduler_redundancy==='object'?'present':'missing',
                      Number.isFinite(age)?String(age):'',
                      ops.last_success_source||'',
                      ops.status||''
                    ].join('|'));
                  }catch{console.log('||||||||');}
                });
              "
            )"

            IFS='|' read -r LIVE_VERSION LIVE_ENGINE LIVE_SHA LIVE_STORAGE LIVE_AUTOPILOT LIVE_REDUNDANCY LIVE_AGE LIVE_SOURCE LIVE_OPS_STATUS <<< "$META"

            UI_STATUS="$(
              printf '%s' "$HOME" |
              node -e "
                let s='';
                process.stdin.on('data',d=>s+=d).on('end',()=>{
                  if(!s.includes('v8.9.3 • STATUS SYNC')) return console.log('STALE');
                  if(!s.includes('/app-v8_9.js?v=8.9.3')) return console.log('OLD_CACHE');
                  console.log('OK');
                });
              "
            )"

            AGE_OK="$(
              node -e "
                const n=Number(process.argv[1]);
                console.log(Number.isFinite(n)&&n<=35?'true':'false');
              " "${LIVE_AGE:-nan}"
            )"

            echo "Attempt $attempt: release=${LIVE_VERSION:-unknown} engine=${LIVE_ENGINE:-unknown} commit=${LIVE_SHA:-unknown} storage=${LIVE_STORAGE:-unknown} autopilot=${LIVE_AUTOPILOT:-unknown} redundancy=${LIVE_REDUNDANCY:-unknown} ops_age=${LIVE_AGE:-unknown} source=${LIVE_SOURCE:-unknown} ops_status=${LIVE_OPS_STATUS:-unknown} ui=$UI_STATUS"

            if \
              [ "$LIVE_VERSION" = "$EXPECTED_VERSION" ] && \
              [ "$LIVE_ENGINE" = "$EXPECTED_ENGINE" ] && \
              [ "$LIVE_SHA" = "$EXPECTED_SHA" ] && \
              [ "$LIVE_STORAGE" = "true" ] && \
              [ "$LIVE_AUTOPILOT" = "true" ] && \
              [ "$LIVE_REDUNDANCY" = "present" ] && \
              [ "$AGE_OK" = "true" ] && \
              [ -n "$LIVE_SOURCE" ] && \
              [ "$LIVE_OPS_STATUS" != "RED" ] && \
              [ "$UI_STATUS" = "OK" ]
            then
              echo "AEGIS v8.9.3 Status Canonicalization production verification passed."
              echo "No Autopilot tick or sportsbook refresh was triggered by this verification."
              exit 0
            fi

            sleep 15
          done

          echo "Production did not prove the expected v8.9.3 canonical status release."
          exit 1
