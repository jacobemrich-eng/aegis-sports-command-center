name: Apply AEGIS NFL v0.7 Shadow Stack

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-and-calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize tested NFL v0.7 payload
        shell: bash
        run: |
          cat > /tmp/aegis-nfl-v07.b64 <<'PAYLOAD'
          
          PAYLOAD
          base64 -d /tmp/aegis-nfl-v07.b64 > /tmp/aegis-nfl-v07.tgz
          tar -xzf /tmp/aegis-nfl-v07.tgz -C .
          rm -f /tmp/aegis-nfl-v07.b64 /tmp/aegis-nfl-v07.tgz

      - name: Compile NFL Python stack
        run: python -m py_compile modeling/nfl/*.py

      - name: Install NFL modeling dependencies
        run: pip install -r modeling/nfl/requirements.txt

      - name: Bootstrap real 2021-2025 nflverse play-by-play
        run: |
          python modeling/nfl/aegis_nflverse_bootstrap.py             --start 2021             --end 2025             --cache-dir data/nflverse             --manifest data/nflverse/bootstrap.json

      - name: Run real leakage-free 2021-2025 NFL walk-forward
        env:
          PYTHONPATH: modeling/nfl
        run: |
          python modeling/nfl/aegis_nfl_real_pipeline.py             --start 2021             --end 2025             --cache-dir data/nflverse             --out-dir data/nfl_walkforward

      - name: Verify shadow-only governance
        run: |
          python - <<'PY'
          import json
          p='data/nfl_walkforward/nfl_shadow_status.json'
          x=json.load(open(p))
          h=x['historical_report']
          assert h['leakage_guard']['market_lines_in_internal_features'] is False
          assert h['shadow_readiness']['real_betting_release_allowed'] is False
          print(json.dumps(h['shadow_readiness'], indent=2))
          PY

      - name: Publish shadow status to Command Center static path
        run: |
          mkdir -p public/data
          cp data/nfl_walkforward/nfl_shadow_status.json public/data/nfl-shadow-status.json

      - name: Validate existing AEGIS application
        run: npm run check

      - name: Commit tested NFL shadow stack and real calibration status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modeling/nfl                   .github/workflows/aegis-nfl-real-walkforward.yml                   public/nfl-shadow.html                   public/nfl-shadow.js                   public/data/nfl-shadow-status.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No repo changes to commit."
          else
            git commit -m "Add AEGIS NFL v0.7 shadow stack and real walk-forward"
            git push origin HEAD:main
          fi

      - name: Upload full historical calibration artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-nfl-v07-real-walkforward
          path: |
            data/nflverse/bootstrap.json
            data/nfl_walkforward/nfl_real_report_*.json
            data/nfl_walkforward/nfl_real_predictions_*.csv
            data/nfl_walkforward/nfl_shadow_status.json
          retention-days: 30
