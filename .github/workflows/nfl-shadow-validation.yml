name: NFL 2026 Shadow Validation

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to the protected SHADOW_ONLY endpoints
        required: true
        default: false
        type: boolean
      mode:
        description: Pipeline phase
        required: true
        default: all
        type: choice
        options: [all, project, grade]
  workflow_call:
    inputs:
      scheduled:
        required: false
        default: true
        type: boolean
      publish:
        required: false
        default: true
        type: boolean
      mode:
        required: false
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: nfl-shadow-validation-2026
  cancel-in-progress: false

jobs:
  validate-shadow:
    environment: nfl-shadow-staging
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      AEGIS_SHADOW_INGEST_SECRET: ${{ secrets.AEGIS_SHADOW_INGEST_SECRET }}
      AEGIS_SHADOW_ENDPOINT: ${{ vars.AEGIS_SHADOW_ENDPOINT }}
      AEGIS_NFL_SHADOW_ALLOWED_HOST: ${{ vars.AEGIS_NFL_SHADOW_ALLOWED_HOST }}
      NFL_SHADOW_SCHEDULED_PUBLISH: ${{ vars.NFL_SHADOW_SCHEDULED_PUBLISH }}
      ODDS_BOOKMAKERS: hardrockbet_fl,fanduel,draftkings,bovada,betmgm,espnbet,fanatics

    steps:
      - name: Apply scheduled-publish kill switch
        id: gate
        shell: bash
        run: |
          ENABLED="true"
          if [ "${{ github.event_name }}" = "workflow_call" ] && [ "${{ inputs.scheduled }}" = "true" ] && [ "$NFL_SHADOW_SCHEDULED_PUBLISH" != "true" ]; then ENABLED="false"; fi
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
          if [ "$ENABLED" = "false" ]; then echo "NFL shadow schedule is disabled; no checkout, data install, Odds API call, or write will run."; fi

      - name: Checkout NFL staging implementation only
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: nfl-shadow-staging

      - name: Validate scheduler credentials without exposing values
        if: steps.gate.outputs.enabled == 'true' && github.event_name == 'workflow_call' && inputs.scheduled == true
        shell: bash
        run: |
          test -n "$AEGIS_SHADOW_INGEST_SECRET" || { echo "AEGIS_SHADOW_INGEST_SECRET is required"; exit 1; }
          test -n "$AEGIS_SHADOW_ENDPOINT" || { echo "AEGIS_SHADOW_ENDPOINT is required"; exit 1; }

      - name: Run quota-free scheduler preflight
        id: scheduler
        if: steps.gate.outputs.enabled == 'true' && github.event_name == 'workflow_call' && inputs.scheduled == true
        run: python modeling/nfl/aegis_nfl_shadow_scheduler.py --season 2026 --output data/nfl-shadow-selection.json

      - name: Select manual pipeline action
        id: manual
        if: steps.gate.outputs.enabled == 'true' && (github.event_name != 'workflow_call' || inputs.scheduled != true)
        shell: bash
        run: |
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then MODE="all"; fi
          if [ "$MODE" = "grade" ]; then ACTION="GRADE_ONLY"; else ACTION="PROJECT_AND_PUBLISH"; fi
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"

      - name: Resolve action
        id: plan
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          ACTION="${{ steps.scheduler.outputs.action }}"
          if [ -z "$ACTION" ]; then ACTION="${{ steps.manual.outputs.action }}"; fi
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "NFL shadow preflight action: $ACTION"

      - name: Exit with zero Odds API calls when nothing is due
        if: steps.plan.outputs.action == 'NO_ACTION'
        run: echo "No NFL shadow snapshot or grade is due; no model install, market API call, or write was performed."

      - name: Set up Python
        if: steps.plan.outputs.action != 'NO_ACTION'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache public NFL data and runtime copies
        if: steps.plan.outputs.action != 'NO_ACTION'
        uses: actions/cache@v4
        with:
          path: |
            data/nflverse
            data/nfl_shadow_live/blind
            data/nfl_shadow_live/market
          key: nfl-shadow-2026-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nfl-shadow-2026-${{ runner.os }}-

      - name: Install locked modeling dependencies
        if: steps.plan.outputs.action != 'NO_ACTION'
        run: pip install -r modeling/nfl/requirements.txt

      - name: Run pipeline and scheduler unit tests
        if: steps.plan.outputs.action != 'NO_ACTION'
        run: python -m unittest modeling/nfl/test_aegis_nfl_live_pipeline.py modeling/nfl/test_aegis_nfl_shadow_scheduler.py

      - name: Validate phase-specific credentials
        if: steps.plan.outputs.action != 'NO_ACTION'
        shell: bash
        run: |
          PUBLISH="${{ inputs.publish }}"
          if [ "${{ github.event_name }}" = "workflow_call" ] && [ "${{ inputs.scheduled }}" = "true" ]; then PUBLISH="true"; fi
          if [ "$PUBLISH" = "true" ]; then
            test -n "$AEGIS_SHADOW_INGEST_SECRET" || { echo "AEGIS_SHADOW_INGEST_SECRET is required"; exit 1; }
            test -n "$AEGIS_SHADOW_ENDPOINT" || { echo "AEGIS_SHADOW_ENDPOINT is required"; exit 1; }
          fi
          if [ "${{ steps.plan.outputs.action }}" = "PROJECT_AND_PUBLISH" ]; then
            test -n "$ODDS_API_KEY" || { echo "ODDS_API_KEY is required for projection/market capture"; exit 1; }
          fi

      - name: Refuse publish unless isolated staging is ready
        if: steps.plan.outputs.action != 'NO_ACTION' && (inputs.publish == true || (github.event_name == 'workflow_call' && inputs.scheduled == true))
        run: python modeling/nfl/aegis_nfl_staging_readiness.py

      - name: Project/publish due snapshots and grade settled games
        if: steps.plan.outputs.action != 'NO_ACTION'
        shell: bash
        run: |
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then MODE="all"; fi
          SELECTION=""
          PUBLISH=""
          if [ "${{ github.event_name }}" = "workflow_call" ] && [ "${{ inputs.scheduled }}" = "true" ]; then
            if [ "${{ steps.plan.outputs.action }}" = "GRADE_ONLY" ]; then MODE="grade"; else MODE="all"; fi
            SELECTION="--selection-file data/nfl-shadow-selection.json"
            PUBLISH="--publish"
          elif [ "${{ inputs.publish }}" = "true" ]; then
            PUBLISH="--publish"
          fi
          python modeling/nfl/aegis_nfl_live_pipeline.py \
            --season 2026 \
            --lookahead-days 10 \
            --mode "$MODE" \
            $SELECTION \
            $PUBLISH

      - name: Retain research artifacts and isolated errors
        if: always() && steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nfl-shadow-validation-${{ github.run_id }}
          path: data/nfl_shadow_live
          if-no-files-found: ignore
          retention-days: 30
