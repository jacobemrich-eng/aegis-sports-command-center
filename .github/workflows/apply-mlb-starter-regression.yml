name: Apply MLB Starter Regression

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch MLB starter model and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          engine = Path('src/engine.js')
          s = engine.read_text()

          def replace_once(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {n}')
              s = s.replace(old, new, 1)

          pat = re.compile(
              r"(function pitcherAdvanced\(st,staffEra=4\.35\)\{.*?\}\n)"
              r"function starterSkill\(st,staffEra=4\.35\)\{.*?\}\n"
              r"function starterExpectedIP",
              re.S,
          )

          m = pat.search(s)
          if not m:
              raise SystemExit('starter functions: expected block was not found')

          new_funcs = r"""function starterRegression(st,staffEra=4.35){
            const raw=pitcherAdvanced(st,staffEra),ip=Math.max(0,baseballInnings(st.inningsPitched)||0);
            const priorEra=clamp(.70*4.35+.30*num(staffEra,4.35),3.65,5.05);
            const priorWhip=clamp(1.30*(.85+.15*priorEra/4.35),1.16,1.46);
            const rawWhip=num(st.whip,priorWhip),rawK9=num(st.strikeoutsPer9Inn,num(st.strikeoutsPer9,8.5)),rawBB9=num(st.walksPer9Inn,num(st.walksPer9,3.0)),rawHR9=num(st.homeRunsPer9,1.15);
            const shrink=(obs,prior,stab)=>{obs=num(obs,prior);const w=ip/(ip+stab);return prior+w*(obs-prior);};
            return {
              ip,priorEra,rawEra:raw.era,rawFip:raw.fip,rawWhip,rawK9,rawBB9,rawHR9,
              era:shrink(raw.era,priorEra,55),
              fip:shrink(raw.fip,priorEra,45),
              whip:shrink(rawWhip,priorWhip,35),
              k9:shrink(rawK9,8.5,25),
              bb9:shrink(rawBB9,3.0,25),
              hr9:shrink(rawHR9,1.15,60),
              sampleWeight:ip/(ip+45),
              sampleConfidence:clamp(45+50*(1-Math.exp(-ip/70)),45,95),
              active:ip<45,
              severe:ip<10
            };
          }

          function starterSkill(st,staffEra=4.35){
            const r=starterRegression(st,staffEra),eraF=safeDiv(r.era,4.35,1),fipF=safeDiv(r.fip,4.35,1),whipF=safeDiv(r.whip,1.30,1),cmdF=clamp(safeDiv(safeDiv(r.bb9,Math.max(4,r.k9),.35),.35,1),.72,1.30),hrF=safeDiv(r.hr9,1.15,1);
            return clamp(.26*eraF+.25*fipF+.18*whipF+.19*cmdF+.12*hrF,.60,1.58);
          }"""

          s = s[:m.start()] + m.group(1) + new_funcs + "\nfunction starterExpectedIP" + s[m.end():]

          replace_once(
              "  const hspSkill=starterSkill(HSP,hEra),aspSkill=starterSkill(ASP,aEra),hExpIP=starterExpectedIP(HSP,hWork),aExpIP=starterExpectedIP(ASP,aWork);",
              "  const hReg=starterRegression(HSP,hEra),aReg=starterRegression(ASP,aEra),hspSkill=starterSkill(HSP,hEra),aspSkill=starterSkill(ASP,aEra),hExpIP=starterExpectedIP(HSP,hWork),aExpIP=starterExpectedIP(ASP,aWork);",
              'MLB starter regression diagnostics'
          )

          replace_once(
              "  const mods=[\n    modelModule('Starting pitcher quality',",
              "  const starterModuleConfidence=hp&&ap?Math.round(clamp(60+.30*Math.min(hReg.sampleConfidence,aReg.sampleConfidence),60,88)):45;\n  const mods=[\n    modelModule('Starting pitcher quality',",
              'starter module confidence'
          )

          mod_pat = re.compile(
              r"    modelModule\('Starting pitcher quality'.*?\),\n"
              r"    modelModule\('Starter workload'"
          )

          mm = mod_pat.search(s)
          if not mm:
              raise SystemExit('starting pitcher module: expected line was not found')

          new_mod = """    modelModule('Starting pitcher quality', (aspSkill-hspSkill)*1.45,aspSkill>hspSkill?'home':'away',`${hp?.fullName||'Home SP'} raw ERA ${hReg.rawEra.toFixed(2)} → reg ${hReg.era.toFixed(2)}, raw FIP ${hReg.rawFip.toFixed(2)} → reg ${hReg.fip.toFixed(2)}, MLB IP ${hReg.ip.toFixed(1)} vs ${ap?.fullName||'Away SP'} raw ERA ${aReg.rawEra.toFixed(2)} → reg ${aReg.era.toFixed(2)}, raw FIP ${aReg.rawFip.toFixed(2)} → reg ${aReg.fip.toFixed(2)}, MLB IP ${aReg.ip.toFixed(1)}. Small MLB samples are shrunk toward team/league priors; command is trusted sooner than ERA/HR outcomes.`,starterModuleConfidence),
              modelModule('Starter workload'"""

          s = s[:mm.start()] + new_mod + s[mm.end():]

          replace_once(
              "  const criticalPenalty=(hp&&ap?0:12)+(lineups.confirmed?0:7)+(hBull.verified&&aBull.verified?0:8);",
              "  const starterSampleMinIp=hp&&ap?Math.min(hReg.ip,aReg.ip):0,starterSamplePenalty=hp&&ap?(starterSampleMinIp<10?6:starterSampleMinIp<30?3:0):0; const criticalPenalty=(hp&&ap?0:12)+(lineups.confirmed?0:7)+(hBull.verified&&aBull.verified?0:8)+starterSamplePenalty;",
              'starter sample penalty'
          )

          replace_once(
              "+(hBull.verified&&aBull.verified?0:5); const rawAgr=",
              "+(hBull.verified&&aBull.verified?0:5)+(starterSamplePenalty?4:0); const rawAgr=",
              'starter uncertainty penalty'
          )

          replace_once(
              "  const risks=[]; if(!hp||!ap)",
              "  const risks=[]; if(hp&&ap&&(hReg.active||aReg.active))risks.push(`Small-sample starter regression active: minimum MLB workload ${starterSampleMinIp.toFixed(1)} IP; volatile ERA/FIP/WHIP/HR inputs were shrunk toward team/league priors.`); if(!hp||!ap)",
              'starter regression risk'
          )

          replace_once(
              "bullpen_verified:!!(hBull.verified&&aBull.verified),total_drivers:totalDrivers",
              "bullpen_verified:!!(hBull.verified&&aBull.verified),starter_regression_active:!!(hp&&ap&&(hReg.active||aReg.active)),starter_sample_min_ip:+starterSampleMinIp.toFixed(1),starter_regression:{home:hReg,away:aReg},total_drivers:totalDrivers",
              'starter regression audit fields'
          )

          replace_once(
              "    if(!proj.probable_starters_confirmed)critical.push('one or both probable starters are unconfirmed');\n    if(hrs<=4&&!proj.lineups_confirmed)",
              "    if(!proj.probable_starters_confirmed)critical.push('one or both probable starters are unconfirmed');\n    if(proj.starter_regression_active)nonCritical.push(`limited MLB starter sample (${Number(proj.starter_sample_min_ip||0).toFixed(1)} IP minimum); pitcher rates are regressed toward priors`);\n    if(hrs<=4&&!proj.lineups_confirmed)",
              'freshness starter sample note'
          )

          replace_once(
              "probToAmerican, executionBands, dataFreshnessGrade, analyzeEvent",
              "probToAmerican, executionBands, dataFreshnessGrade, starterRegression, analyzeEvent",
              'starter regression export'
          )

          engine.write_text(s)

          tests = Path('tests/engine.test.js')
          t = tests.read_text()

          marker = "small-sample MLB starter regression shrinks extreme rate stats"

          if marker not in t:
              t += r"""

          test('small-sample MLB starter regression shrinks extreme rate stats', () => {
            const r=e.starterRegression({
              era:'18.00',inningsPitched:'3.0',strikeOuts:4,baseOnBalls:3,hitBatsmen:0,
              homeRuns:2,battersFaced:17,whip:'2.33',strikeoutsPer9Inn:'12.00',
              walksPer9Inn:'9.00',homeRunsPer9:'6.00'
            },4.35);

            assert.equal(r.active,true);
            assert.equal(r.severe,true);
            assert.ok(r.rawEra>10);
            assert.ok(r.rawFip>10);
            assert.ok(r.era>4.35&&r.era<6);
            assert.ok(r.fip>4.35&&r.fip<6);
            assert.ok(r.sampleWeight<.10);
          });

          test('established MLB starter sample keeps most of its observed ERA signal', () => {
            const r=e.starterRegression({
              era:'3.00',inningsPitched:'180.0',strikeOuts:190,baseOnBalls:50,hitBatsmen:4,
              homeRuns:20,battersFaced:730,whip:'1.10',strikeoutsPer9Inn:'9.50',
              walksPer9Inn:'2.50',homeRunsPer9:'1.00'
            },4.35);

            assert.equal(r.active,false);
            assert.ok(r.sampleWeight>.75);
            assert.ok(Math.abs(r.era-3.00)<.40);
          });
          """

              tests.write_text(t)

          print('MLB small-sample starter regression patch applied.')
          PY

      - name: Run full AEGIS checks
        run: npm check

      - name: Commit tested model update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine.js tests/engine.test.js
          git diff --cached --check
          git commit -m "Add MLB small-sample starter regression"
          git push origin HEAD:main
