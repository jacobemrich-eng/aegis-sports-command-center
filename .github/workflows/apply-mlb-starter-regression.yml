name: Apply MLB Starter Regression

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply regression patch
        run: python scripts/apply-mlb-starter-regression.py

      - name: Run full AEGIS checks
        run: npm run check

      - name: Commit tested update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine.js tests/engine.test.js
          git diff --cached --check
          git commit -m "Add MLB small-sample starter regression"
          git push origin HEAD:main
