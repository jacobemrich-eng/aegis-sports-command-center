name: Apply Final Card Time UI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply Final Card UI patch
        run: python scripts/apply-final-card-time-ui.py

      - name: Run full AEGIS checks
        run: npm run check

      - name: Commit tested UI update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js
          git diff --cached --check
          git commit -m "Clarify Final Card game time and market freshness"
          git push origin HEAD:main
