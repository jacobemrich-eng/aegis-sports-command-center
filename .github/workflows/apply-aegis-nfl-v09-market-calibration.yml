name: Apply AEGIS NFL v0.9 Market Challenger Calibration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calibrate-market-challenger:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyarrow requests scikit-learn

      - name: Rebuild clean v0.8 out-of-sample predictions
        run: |
          python modeling/nfl/aegis_nfl_v08_pipeline.py --start 2021 --end 2025 --cache-dir data/nflverse --out-dir data/nfl_walkforward_v08

      - name: Install v0.9 calibrator
        shell: bash
        run: |
          mkdir -p modeling/nfl public/data data/nfl_walkforward_v09
          echo '' | base64 -d > modeling/nfl/aegis_nfl_v09_market_calibrator.py
          echo '' | base64 -d > public/nfl-v09-calibration.html
          echo '' | base64 -d > modeling/nfl/README_v0.9.md
          python -m py_compile modeling/nfl/aegis_nfl_v09_market_calibrator.py

      - name: Run time-ordered market calibration
        run: |
          python modeling/nfl/aegis_nfl_v09_market_calibrator.py             --predictions data/nfl_walkforward_v08/nfl_v08_predictions_2021_2025.csv             --v08-report data/nfl_walkforward_v08/nfl_v08_report_2021_2025.json             --out-dir data/nfl_walkforward_v09

      - name: Publish v0.9 shadow outputs
        run: |
          cp data/nfl_walkforward_v09/nfl_v09_shadow_status.json public/data/nfl-v09-shadow-status.json
          cp data/nfl_walkforward_v09/nfl_v09_report.json public/data/nfl-v09-report.json
          cp data/nfl_walkforward_v09/nfl_v09_weights.csv public/data/nfl-v09-weights.csv

      - name: Add Actions summary
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          s=json.loads(Path("data/nfl_walkforward_v09/nfl_v09_report.json").read_text())
          m=s["metrics"]; v=m["v09_calibrated"]; mk=m["market"]; old=m["v08_internal"]
          lines=[
            "# AEGIS NFL v0.9 Market Challenger Calibration",
            f"- Status: **{s['shadow_readiness']['status']}**",
            f"- Calibration holdout: **{m['holdout_games']}**",
            f"- Margin MAE: v0.9 **{v['margin_mae']:.3f}** | market **{mk['margin_mae']:.3f}** | v0.8 **{old['margin_mae']:.3f}**",
            f"- Total MAE: v0.9 **{v['total_mae']:.3f}** | market **{mk['total_mae']:.3f}** | v0.8 **{old['total_mae']:.3f}**",
            f"- Cover Brier: v0.9 **{v['cover_brier']:.4f}** | v0.8 **{old['cover_brier']:.4f}**",
            f"- Over Brier: v0.9 **{v['over_brier']:.4f}** | v0.8 **{old['over_brier']:.4f}**",
            "- 7+ point disagreement: **PASS**",
            "- Production release: **DISABLED**"
          ]
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines)+"\n")
          PY

      - name: Run repository checks
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; fi
          if node -e "const p=require('./package.json'); process.exit(p.scripts&&p.scripts.check?0:1)" 2>/dev/null; then npm run check; fi

      - name: Commit tested NFL v0.9 calibration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modeling/nfl/aegis_nfl_v09_market_calibrator.py                   modeling/nfl/README_v0.9.md                   public/nfl-v09-calibration.html                   public/data/nfl-v09-shadow-status.json                   public/data/nfl-v09-report.json                   public/data/nfl-v09-weights.csv
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add AEGIS NFL v0.9 market challenger calibration"
            git push origin HEAD:main
          fi

      - name: Upload full v0.9 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-nfl-v09-market-calibration
          path: |
            data/nfl_walkforward_v09/**
            public/data/nfl-v09-*
          retention-days: 30
