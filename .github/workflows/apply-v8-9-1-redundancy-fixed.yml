          t=t.replace(r'/app-v8_9\.js\?v=8\.9\.0',r'/app-v8_9\.js\?v=8\.9\.1')
          t=t.replace(r'/visual-v8_9\.css\?v=8\.9\.0',r'/visual-v8_9\.css\?v=8\.9\.1')
          t=t.replace("assert.equal(pkg.version,'8.9.0');","assert.equal(pkg.version,'8.9.1');")
          t=t.replace("test('v8.9 UI is additive, calm, cache-busted, and free of common mojibake'","test('v8.9.1 UI is additive, redundant, cache-busted, and free of common mojibake'",1)
          t=t.replace("test('v8.9 platform release does not rewrite the v8.8 Decision Intelligence engine'","test('v8.9.1 platform release does not rewrite the v8.8 Decision Intelligence engine'",1)
          if "assert.equal(pkg.version,'8.9.1');" not in t:
              raise SystemExit('operations version test did not patch')
          ops_test_path.write_text(t,encoding='utf-8')
          
          health_path=Path('tests/health-contract.test.js')
          h=health_path.read_text(encoding='utf-8')
          if '8.9.0' not in h:
              raise SystemExit('v8.9.0 health contract anchor missing')
          h=h.replace('8.9.0','8.9.1')
          health_path.write_text(h,encoding='utf-8')
          
          front_path=Path('tests/frontend-stability.test.js')
          f=front_path.read_text(encoding='utf-8')
          old_header=r'v8\.9 • AUTONOMOUS OPS'
          if old_header not in f:
              raise SystemExit('v8.9 frontend header test anchor missing')
          f=f.replace(old_header,r'v8\.9\.1 • REDUNDANT OPS',1)
          f=f.replace(
              'index declares UTF-8, v8.9 operations shell, and v8.8 core bundle cache keys',
