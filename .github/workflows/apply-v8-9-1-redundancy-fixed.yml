      - name: Commit tested v8.9.1 changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add \
            package.json \
            render.yaml \
            server.js \
            src/heartbeat.js \
            src/operations.js \
            public/app-v8_9.js \
            public/index.html \
            tests/heartbeat.test.js \
            tests/operations.test.js \
            tests/health-contract.test.js \
            tests/frontend-stability.test.js \
            README.md
          
          git diff --cached --check
          
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Apply AEGIS v8.9.1 scheduler redundancy"
            git push origin HEAD:main
          fi

      - name: Verify live Render v8.9.1
        shell: bash
        env:
          BASE_URL: https://aegis-sports-command-center.onrender.com
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(git rev-parse HEAD)"
          EXPECTED_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_ENGINE="8.8.0-decision-intelligence"
          
          echo "Expected release: $EXPECTED_VERSION"
          echo "Expected engine: $EXPECTED_ENGINE"
          echo "Expected commit: $EXPECTED_SHA"
          
          for attempt in $(seq 1 24); do
            HEALTH="$(curl -fsS --max-time 20 "$BASE_URL/api/health" || true)"
            HOME="$(curl -fsS --max-time 20 "$BASE_URL/" || true)"
            HB_CODE="$(curl -sS -o /tmp/aegis-heartbeat-probe.json -w "%{http_code}" --max-time 20 -X POST "$BASE_URL/api/autopilot/heartbeat" || true)"
          
            META="$(
              printf '%s' "$HEALTH" |
              node -e "
                let s='';
                process.stdin.on('data',d=>s+=d).on('end',()=>{
                  try{
                    const j=JSON.parse(s);
                    console.log([
                      j.release_version||'',
                      j.engine_version||'',
                      j.deploy?.git_commit||'',
                      j.persistent_storage===true?'true':'false',
                      j.autopilot_enabled===true?'true':'false',
                      j.scheduler_redundancy&&typeof j.scheduler_redundancy==='object'?'present':'missing'
                    ].join('|'));
                  }catch{console.log('|||||');}
                });
              "
            )"
          
            IFS='|' read -r \
              LIVE_VERSION \
              LIVE_ENGINE \
              LIVE_SHA \
              LIVE_STORAGE \
              LIVE_AUTOPILOT \
              LIVE_REDUNDANCY \
              <<< "$META"
          
            UI_STATUS="$(
              printf '%s' "$HOME" |
              node -e "
                let s='';
                process.stdin.on('data',d=>s+=d).on('end',()=>{
                  if(!s.includes('v8.9.1 • REDUNDANT OPS')) return console.log('STALE');
                  if(!s.includes('/app-v8_9.js?v=8.9.1')) return console.log('OLD_CACHE');
                  console.log('OK');
                });
              "
            )"
          
            echo "Attempt $attempt: release=${LIVE_VERSION:-unknown} engine=${LIVE_ENGINE:-unknown} commit=${LIVE_SHA:-unknown} storage=${LIVE_STORAGE:-unknown} autopilot=${LIVE_AUTOPILOT:-unknown} redundancy=${LIVE_REDUNDANCY:-unknown} heartbeat_auth=$HB_CODE ui=$UI_STATUS"
          
            if \
              [ "$LIVE_VERSION" = "$EXPECTED_VERSION" ] && \
              [ "$LIVE_ENGINE" = "$EXPECTED_ENGINE" ] && \
              [ "$LIVE_SHA" = "$EXPECTED_SHA" ] && \
              [ "$LIVE_STORAGE" = "true" ] && \
              [ "$LIVE_AUTOPILOT" = "true" ] && \
              [ "$LIVE_REDUNDANCY" = "present" ] && \
              [ "$HB_CODE" = "401" ] && \
              [ "$UI_STATUS" = "OK" ]
            then
              echo "AEGIS v8.9.1 Scheduler Redundancy production verification passed."
              exit 0
            fi
          
            sleep 15
          done
          
          echo "Production did not prove the expected v8.9.1 scheduler redundancy release."
          exit 1
