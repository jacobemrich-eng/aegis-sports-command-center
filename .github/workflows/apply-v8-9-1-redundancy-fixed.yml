name: Apply AEGIS v8.9.1 Scheduler Redundancy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Stage scheduler heartbeat core
        shell: bash
        run: |
          set -euo pipefail
          cat > src/heartbeat.js <<'EOF_SRC_HEARTBEAT_JS'
          'use strict';
          
          const crypto=require('crypto');
          
          let inFlight=null;
          let telemetry={
            last_probe_at:null,
            last_decision:null,
            last_queued_at:null,
            last_triggered_at:null,
            last_recovery_success_at:null,
            last_result:null,
            last_error:null
          };
          
          function finite(v){
            const n=Number(v);
            return Number.isFinite(n)?n:null;
          }
          
          function iso(nowMs=Date.now()){
            return new Date(nowMs).toISOString();
          }
          
          function ageMinutes(value,nowMs=Date.now()){
            if(!value)return null;
            const ms=new Date(value).getTime();
            if(!Number.isFinite(ms))return null;
            return Math.max(0,(nowMs-ms)/60000);
          }
          
          function bearerToken(header){
            const raw=String(header||'');
            return raw.startsWith('Bearer ')?raw.slice(7).trim():'';
          }
          
          function authorized(header,secret){
            const expected=String(secret||'').trim();
            const actual=bearerToken(header);
            if(!expected||!actual)return false;
            const a=Buffer.from(actual);
            const b=Buffer.from(expected);
            return a.length===b.length&&crypto.timingSafeEqual(a,b);
          }
          
          function publicState({
            secretReady=false,
            autopilotSecretReady=false,
            staleMinutes=35,
            probeFreshMinutes=25,
            debounceMs=15000,
            uptimeSeconds=null,
            nowMs=Date.now()
          }={}){
            const ready=!!secretReady&&!!autopilotSecretReady;
            const probeAge=ageMinutes(telemetry.last_probe_at,nowMs);
            const uptime=finite(uptimeSeconds);
            const grace=ready&&probeAge===null&&uptime!==null&&uptime<20*60;
            let status='UNCONFIGURED';
            if(ready){
              if(inFlight)status='RECOVERY_RUNNING';
              else if(telemetry.last_error)status='RECOVERY_ERROR';
              else if(probeAge===null)status=grace?'STARTING':'AWAITING_PROBE';
              else if(probeAge<=Number(probeFreshMinutes||25))status='HEALTHY';
              else status='STALE';
            }
            return {
              ready,
              status,
              heartbeat_secret_ready:!!secretReady,
              autopilot_secret_ready:!!autopilotSecretReady,
              in_flight:!!inFlight,
              stale_after_minutes:Number(staleMinutes||35),
              probe_fresh_minutes:Number(probeFreshMinutes||25),
              debounce_seconds:+(Number(debounceMs||15000)/1000).toFixed(1),
              last_probe_at:telemetry.last_probe_at,
              last_probe_age_minutes:probeAge===null?null:+probeAge.toFixed(1),
              last_decision:telemetry.last_decision,
              last_queued_at:telemetry.last_queued_at,
              last_triggered_at:telemetry.last_triggered_at,
              last_recovery_success_at:telemetry.last_recovery_success_at,
              last_result:telemetry.last_result,
              last_error:telemetry.last_error,
              startup_grace:grace
            };
          }
          
          function decide({
            operations={},
            storage={},
            secretReady=false,
            autopilotSecretReady=false,
            staleMinutes=35,
            uptimeSeconds=null,
            nowMs=Date.now()
          }={}){
            const age=finite(operations.last_success_age_minutes);
            const uptime=finite(uptimeSeconds);
            let trigger=false;
            let reason='fresh';
          
            if(!secretReady)reason='heartbeat_secret_missing';
            else if(!autopilotSecretReady)reason='autopilot_secret_missing';
            else if(operations.inside_operating_window===false)reason='sleep_window';
            else if(storage.ok===false||storage.persistent!==true)reason='persistence_unhealthy';
            else if(inFlight)reason='recovery_in_flight';
            else if(age!==null&&age<Number(staleMinutes||35))reason='fresh';
            else if(age===null&&uptime!==null&&uptime<Number(staleMinutes||35)*60)reason='startup_grace';
            else{
              trigger=true;
              reason=age===null?'no_success_recorded':'scheduler_stale';
            }
          
            return {
              trigger,
              reason,
              last_success_age_minutes:age,
              threshold_minutes:Number(staleMinutes||35),
              evaluated_at:iso(nowMs)
            };
          }
          
          function recordProbe(decision,nowMs=Date.now()){
            telemetry.last_probe_at=iso(nowMs);
            telemetry.last_decision=decision?.reason||null;
            if(decision?.reason==='fresh'){
              telemetry.last_error=null;
              if(telemetry.last_result==='error')telemetry.last_result='primary_fresh';
            }
            return telemetry.last_probe_at;
          }
          
          function wait(ms){
            return new Promise(resolve=>setTimeout(resolve,Math.max(0,Number(ms)||0)));
          }
          
          function queueRecovery({delayMs=15000,recheck,run}={}){
            if(inFlight)return false;
            if(typeof recheck!=='function'||typeof run!=='function')throw new Error('heartbeat recovery requires recheck and run callbacks');
          
            telemetry.last_queued_at=iso();
            telemetry.last_result='queued';
            telemetry.last_error=null;
          
            inFlight=(async()=>{
              await wait(delayMs);
              const gate=await recheck();
              if(!gate||gate.trigger!==true){
                telemetry.last_result=`suppressed:${gate?.reason||'recheck'}`;
                return {suppressed:true,reason:gate?.reason||'recheck'};
              }
          
              telemetry.last_triggered_at=iso();
              telemetry.last_result='running';
              const result=await run();
              telemetry.last_recovery_success_at=iso();
              telemetry.last_result='success';
              telemetry.last_error=null;
              return result;
            })().catch(err=>{
              telemetry.last_result='error';
              telemetry.last_error=String(err?.message||err||'heartbeat recovery failed').slice(0,240);
              console.error('[AEGIS heartbeat recovery]',telemetry.last_error);
              return {ok:false,error:telemetry.last_error};
            }).finally(()=>{
              inFlight=null;
            });
          
            return true;
          }
          
          async function waitForIdleForTest(){
            if(inFlight)await inFlight;
          }
          
          function resetForTests(){
            inFlight=null;
            telemetry={
              last_probe_at:null,
              last_decision:null,
              last_queued_at:null,
              last_triggered_at:null,
              last_recovery_success_at:null,
              last_result:null,
              last_error:null
            };
          }
          
          module.exports={
            authorized,
            publicState,
            decide,
            recordProbe,
            queueRecovery,
            _waitForIdleForTest:waitForIdleForTest,
            _resetForTests:resetForTests
          };
          EOF_SRC_HEARTBEAT_JS

      - name: Stage scheduler heartbeat tests
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/heartbeat.test.js <<'EOF_TESTS_HEARTBEAT_TEST_JS'
          const test=require('node:test');
          const assert=require('node:assert/strict');
          const h=require('../src/heartbeat');
          
          test.beforeEach(()=>h._resetForTests());
          
          test('fresh primary suppresses backup recovery',()=>{
            const x=h.decide({operations:{inside_operating_window:true,last_success_age_minutes:12},storage:{ok:true,persistent:true},secretReady:true,autopilotSecretReady:true,staleMinutes:35,uptimeSeconds:3600});
            assert.equal(x.trigger,false); assert.equal(x.reason,'fresh');
          });
          
          test('stale primary triggers backup recovery',()=>{
            const x=h.decide({operations:{inside_operating_window:true,last_success_age_minutes:41},storage:{ok:true,persistent:true},secretReady:true,autopilotSecretReady:true,staleMinutes:35,uptimeSeconds:3600});
            assert.equal(x.trigger,true); assert.equal(x.reason,'scheduler_stale');
          });
          
          test('sleep window never spends a recovery tick',()=>{
            const x=h.decide({operations:{inside_operating_window:false,last_success_age_minutes:400},storage:{ok:true,persistent:true},secretReady:true,autopilotSecretReady:true});
            assert.equal(x.trigger,false); assert.equal(x.reason,'sleep_window');
          });
          
          test('separate heartbeat secret is mandatory',()=>{
            const x=h.decide({operations:{inside_operating_window:true,last_success_age_minutes:50},storage:{ok:true,persistent:true},secretReady:false,autopilotSecretReady:true});
            assert.equal(x.trigger,false); assert.equal(x.reason,'heartbeat_secret_missing');
          });
          
          test('production persistence failure blocks recovery trigger',()=>{
            const x=h.decide({operations:{inside_operating_window:true,last_success_age_minutes:50},storage:{ok:false,persistent:false},secretReady:true,autopilotSecretReady:true});
            assert.equal(x.trigger,false); assert.equal(x.reason,'persistence_unhealthy');
          });
          
          test('bearer secret comparison accepts exact secret only',()=>{
            assert.equal(h.authorized('Bearer abc123','abc123'),true);
            assert.equal(h.authorized('Bearer abc124','abc123'),false);
            assert.equal(h.authorized('abc123','abc123'),false);
          });
          
          test('queue deduplicates and executes one recovery',async()=>{
            let runs=0;
            const a=h.queueRecovery({delayMs:0,recheck:async()=>({trigger:true,reason:'scheduler_stale'}),run:async()=>{runs++;return {ok:true};}});
            const b=h.queueRecovery({delayMs:0,recheck:async()=>({trigger:true}),run:async()=>{runs++;return {ok:true};}});
            assert.equal(a,true); assert.equal(b,false);
            await h._waitForIdleForTest();
            assert.equal(runs,1);
            assert.equal(h.publicState({secretReady:true,autopilotSecretReady:true,uptimeSeconds:3600}).last_result,'success');
          });
          
          test('debounced recheck suppresses recovery if primary recovered',async()=>{
            let runs=0;
            assert.equal(h.queueRecovery({delayMs:0,recheck:async()=>({trigger:false,reason:'fresh'}),run:async()=>{runs++;}}),true);
            await h._waitForIdleForTest();
            assert.equal(runs,0);
            assert.equal(h.publicState({secretReady:true,autopilotSecretReady:true,uptimeSeconds:3600}).last_result,'suppressed:fresh');
          });
          
          test('authenticated probes make redundancy state healthy',()=>{
            h.recordProbe({reason:'fresh'},Date.parse('2026-09-03T16:00:00Z'));
            const s=h.publicState({secretReady:true,autopilotSecretReady:true,nowMs:Date.parse('2026-09-03T16:08:00Z'),uptimeSeconds:3600});
            assert.equal(s.ready,true); assert.equal(s.status,'HEALTHY'); assert.equal(s.last_probe_age_minutes,8);
          });
          
          test('repository wiring exposes protected heartbeat recovery without changing primary cadence',()=>{
            const fs=require('node:fs');
            const path=require('node:path');
            const ROOT=path.join(__dirname,'..');
            const server=fs.readFileSync(path.join(ROOT,'server.js'),'utf8');
            const workflow=fs.readFileSync(path.join(ROOT,'.github/workflows/aegis-autopilot.yml'),'utf8');
            assert.match(server,/\/api\/autopilot\/heartbeat/);
            assert.match(server,/AEGIS_HEARTBEAT_SECRET/);
            assert.match(server,/heartbeat\.queueRecovery/);
            assert.match(server,/127\.0\.0\.1:\$\{PORT\}\/api\/autopilot\/tick/);
            assert.match(workflow,/2,17,32,47 \* \* \* \*/);
          });
          
          test('Render contract declares a separate unsynced heartbeat secret',()=>{
            const fs=require('node:fs');
            const path=require('node:path');
            const ROOT=path.join(__dirname,'..');
            const render=fs.readFileSync(path.join(ROOT,'render.yaml'),'utf8');
            assert.match(render,/AEGIS_HEARTBEAT_SECRET/);
            assert.match(render,/AEGIS_HEARTBEAT_STALE_MINUTES/);
            assert.match(render,/value:\s*["']?35["']?/);
          });
          
          test('Operations Guardian and UI surface scheduler redundancy',()=>{
            const fs=require('node:fs');
            const path=require('node:path');
            const ROOT=path.join(__dirname,'..');
            const operations=fs.readFileSync(path.join(ROOT,'src/operations.js'),'utf8');
            const ui=fs.readFileSync(path.join(ROOT,'public/app-v8_9.js'),'utf8');
            const html=fs.readFileSync(path.join(ROOT,'public/index.html'),'utf8');
            assert.match(operations,/scheduler_redundancy/);
            assert.match(operations,/primary-only/);
            assert.match(ui,/REDUNDANT/);
            assert.match(html,/v8\.9\.1 • REDUNDANT OPS/);
          });
          EOF_TESTS_HEARTBEAT_TEST_JS
      - name: Patch release and Render heartbeat contract
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import json
          import re
          
          ROOT=Path('.')
          
          pkg_path=ROOT/'package.json'
          pkg=json.loads(pkg_path.read_text(encoding='utf-8'))
          if pkg.get('version')!='8.9.0':
              raise SystemExit(f"Expected v8.9.0 before v8.9.1; found {pkg.get('version')!r}. Refusing unsafe patch.")
          pkg['version']='8.9.1'
          check=pkg.get('scripts',{}).get('check','')
          if 'node --check src/heartbeat.js' not in check:
              anchor='node --check src/operations.js'
              if anchor not in check:
                  raise SystemExit('package syntax-gate anchor missing')
              check=check.replace(anchor,anchor+' && node --check src/heartbeat.js',1)
          pkg['scripts']['check']=check
          pkg_path.write_text(json.dumps(pkg,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          
          render_path=ROOT/'render.yaml'
          render=render_path.read_text(encoding='utf-8')
          if 'AEGIS_HEARTBEAT_SECRET' not in render:
              m=re.search(r'(?m)^(\s*)- key: AEGIS_AUTOPILOT_SECRET\s*\n\1  sync: false\s*$',render)
              if not m:
                  raise SystemExit('render Autopilot secret anchor missing')
              indent=m.group(1)
              block=m.group(0)+'\n'+(
                  f"{indent}- key: AEGIS_HEARTBEAT_SECRET\n"
                  f"{indent}  sync: false\n"
                  f"{indent}- key: AEGIS_HEARTBEAT_STALE_MINUTES\n"
                  f"{indent}  value: \"35\"\n"
                  f"{indent}- key: AEGIS_HEARTBEAT_PROBE_FRESH_MINUTES\n"
                  f"{indent}  value: \"25\"\n"
                  f"{indent}- key: AEGIS_HEARTBEAT_DEBOUNCE_MS\n"
                  f"{indent}  value: \"15000\""
              )
              render=render[:m.start()]+block+render[m.end():]
          render_path.write_text(render,encoding='utf-8')
          print('v8.9.1 release and Render heartbeat contract staged.')
          PY

      - name: Patch server redundancy state
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re
          
          p=Path('server.js')
          s=p.read_text(encoding='utf-8')
          
          if "require('./src/heartbeat')" not in s:
              anchor="const operations = require('./src/operations');"
              if anchor not in s:
                  raise SystemExit('server Operations Guardian import anchor missing')
              s=s.replace(anchor,anchor+"\nconst heartbeat = require('./src/heartbeat');",1)
          
          release_pattern=re.compile(
              r'(?m)^(\s*)releaseSports:autopilot\.config\.RELEASE_SPORTS(?P<comma>,?)$'
          )
          matches=list(release_pattern.finditer(s))
          if len(matches)<2:
              raise SystemExit(f'expected at least 2 server releaseSports config anchors, found {len(matches)}')
          
          def add_redundancy(match):
              indent=match.group(1)
              trailing=',' if match.group('comma') else ''
              return (
                  f"{indent}releaseSports:autopilot.config.RELEASE_SPORTS,\n"
                  f"{indent}schedulerRedundancy:heartbeat.publicState({{\n"
                  f"{indent}  secretReady:!!String(process.env.AEGIS_HEARTBEAT_SECRET||'').trim(),\n"
                  f"{indent}  autopilotSecretReady:!!String(process.env.AEGIS_AUTOPILOT_SECRET||'').trim(),\n"
                  f"{indent}  staleMinutes:Number(process.env.AEGIS_HEARTBEAT_STALE_MINUTES||35),\n"
                  f"{indent}  probeFreshMinutes:Number(process.env.AEGIS_HEARTBEAT_PROBE_FRESH_MINUTES||25),\n"
                  f"{indent}  debounceMs:Number(process.env.AEGIS_HEARTBEAT_DEBOUNCE_MS||15000),\n"
                  f"{indent}  uptimeSeconds:process.uptime()\n"
                  f"{indent}}}){trailing}"
              )
          
          s=release_pattern.sub(add_redundancy,s,count=2)

          inserted=s.count('schedulerRedundancy:heartbeat.publicState({')
          if inserted!=2:
              raise SystemExit(f'expected exactly 2 scheduler redundancy config blocks after patch, found {inserted}')
          
          ops_pattern=re.compile(r'(?m)^(\s*)operations:ops(?P<comma>,?)$')
          ops_matches=list(ops_pattern.finditer(s))
          if len(ops_matches)!=2:
              raise SystemExit(f'expected 2 server operations response anchors, found {len(ops_matches)}')
          
          def add_response_state(match):
              indent=match.group(1)
              trailing=',' if match.group('comma') else ''
              return (
                  f"{indent}operations:ops,\n"
                  f"{indent}scheduler_redundancy:ops.safeguards?.scheduler_redundancy||null{trailing}"
              )
          
          s=ops_pattern.sub(add_response_state,s,count=2)
          
          p.write_text(s,encoding='utf-8')
          print('server redundancy state staged.')
          PY
      - name: Add protected heartbeat recovery route
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          
          p=Path('server.js')
          s=p.read_text(encoding='utf-8')
          if "/api/autopilot/heartbeat" in s:
              raise SystemExit('heartbeat route already exists unexpectedly')
          
          login="if(req.method==='POST'&&u.pathname==='/api/login'){"
          pos=s.find(login)
          if pos<0:
              raise SystemExit('server login insertion anchor missing')
          
          route=r'''if(req.method==='POST'&&u.pathname==='/api/autopilot/heartbeat'){
            const heartbeatSecret=String(process.env.AEGIS_HEARTBEAT_SECRET||'').trim();
            const autopilotSecret=String(process.env.AEGIS_AUTOPILOT_SECRET||'').trim();
          
            if(!heartbeat.authorized(req.headers.authorization,heartbeatSecret)){
              return send(res,401,{ok:false,error:'unauthorized'});
            }
          
            const storage=await store.health(),
                  auto=await safeStatus();
          
            const heartbeatState=heartbeat.publicState({
              secretReady:!!heartbeatSecret,
              autopilotSecretReady:!!autopilotSecret,
              staleMinutes:Number(process.env.AEGIS_HEARTBEAT_STALE_MINUTES||35),
              probeFreshMinutes:Number(process.env.AEGIS_HEARTBEAT_PROBE_FRESH_MINUTES||25),
              debounceMs:Number(process.env.AEGIS_HEARTBEAT_DEBOUNCE_MS||15000),
              uptimeSeconds:process.uptime()
            });
          
            const ops=operations.evaluate({
              auto,
              storage,
              config:{
                autopilotEnabled:auto.enabled,
                dailyBudget:autopilot.config.DAILY_BUDGET,
                monthlyBudget:autopilot.config.MONTHLY_BUDGET,
                scheduleMinutes:15,
                autoLockMinutes:Number(process.env.AEGIS_AUTO_LOCK_MINUTES||30),
                gradeDelayHours:Number(process.env.AEGIS_GRADE_DELAY_HOURS||2),
                releaseSports:autopilot.config.RELEASE_SPORTS,
                schedulerRedundancy:heartbeatState
              },
              production:process.env.NODE_ENV==='production',
              uptimeSeconds:process.uptime()
            });
          
            const gate=heartbeat.decide({
              operations:ops,
              storage,
              secretReady:!!heartbeatSecret,
              autopilotSecretReady:!!autopilotSecret,
              staleMinutes:Number(process.env.AEGIS_HEARTBEAT_STALE_MINUTES||35),
              uptimeSeconds:process.uptime()
            });
          
            heartbeat.recordProbe(gate);
          
            if(!gate.trigger){
              return send(res,200,{
                ok:true,
                triggered:false,
                reason:gate.reason,
                last_success_age_minutes:gate.last_success_age_minutes,
                redundancy:heartbeat.publicState({
                  secretReady:!!heartbeatSecret,
                  autopilotSecretReady:!!autopilotSecret,
                  staleMinutes:Number(process.env.AEGIS_HEARTBEAT_STALE_MINUTES||35),
                  probeFreshMinutes:Number(process.env.AEGIS_HEARTBEAT_PROBE_FRESH_MINUTES||25),
                  debounceMs:Number(process.env.AEGIS_HEARTBEAT_DEBOUNCE_MS||15000),
                  uptimeSeconds:process.uptime()
                })
              });
            }
          
            const queued=heartbeat.queueRecovery({
              delayMs:Number(process.env.AEGIS_HEARTBEAT_DEBOUNCE_MS||15000),
              recheck:async()=>{
                const storage2=await store.health(),
                      auto2=await safeStatus();
                const state2=heartbeat.publicState({
                  secretReady:!!heartbeatSecret,
                  autopilotSecretReady:!!autopilotSecret,
                  staleMinutes:Number(process.env.AEGIS_HEARTBEAT_STALE_MINUTES||35),
                  probeFreshMinutes:Number(process.env.AEGIS_HEARTBEAT_PROBE_FRESH_MINUTES||25),
                  debounceMs:Number(process.env.AEGIS_HEARTBEAT_DEBOUNCE_MS||15000),
                  uptimeSeconds:process.uptime()
                });
                const ops2=operations.evaluate({
                  auto:auto2,
                  storage:storage2,
                  config:{
                    autopilotEnabled:auto2.enabled,
                    dailyBudget:autopilot.config.DAILY_BUDGET,
                    monthlyBudget:autopilot.config.MONTHLY_BUDGET,
                    scheduleMinutes:15,
                    autoLockMinutes:Number(process.env.AEGIS_AUTO_LOCK_MINUTES||30),
                    gradeDelayHours:Number(process.env.AEGIS_GRADE_DELAY_HOURS||2),
                    releaseSports:autopilot.config.RELEASE_SPORTS,
                    schedulerRedundancy:state2
                  },
                  production:process.env.NODE_ENV==='production',
                  uptimeSeconds:process.uptime()
                });
                return heartbeat.decide({
                  operations:ops2,
                  storage:storage2,
                  secretReady:!!heartbeatSecret,
                  autopilotSecretReady:!!autopilotSecret,
                  staleMinutes:Number(process.env.AEGIS_HEARTBEAT_STALE_MINUTES||35),
                  uptimeSeconds:process.uptime()
                });
              },
              run:async()=>{
                const controller=new AbortController();
                const timer=setTimeout(()=>controller.abort(),220000);
                try{
                  const response=await fetch(`http://127.0.0.1:${PORT}/api/autopilot/tick`,{
                    method:'POST',
                    headers:{
                      Authorization:`Bearer ${autopilotSecret}`,
                      'Content-Type':'application/json',
                      'X-AEGIS-Recovery-Source':'heartbeat'
                    },
                    signal:controller.signal
                  });
                  const raw=await response.text();
                  let body=null;
                  try{body=raw?JSON.parse(raw):null;}catch{}
                  if(!response.ok||!body||body.ok!==true){
                    throw new Error(`autopilot_tick_failed_${response.status}`);
                  }
                  return {
                    ok:true,
                    status:response.status,
                    runs:Array.isArray(body.runs)?body.runs.length:null,
                    errors:Array.isArray(body.errors)?body.errors.length:null,
                    graded:body.graded??null,
                    persistent:body.persistent??null
                  };
                }finally{
                  clearTimeout(timer);
                }
              }
            });
          
            return send(res,queued?202:200,{
              ok:true,
              triggered:queued,
              reason:queued?'recovery_queued':'recovery_already_queued',
              last_success_age_minutes:gate.last_success_age_minutes
            });
          }'''
          
          s=s[:pos]+route+'\n  '+s[pos:]
          p.write_text(s,encoding='utf-8')
          print('protected heartbeat route staged.')
          PY

      - name: Patch Operations Guardian for redundancy
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          
          p=Path('src/operations.js')
          s=p.read_text(encoding='utf-8')
          
          anchor="  const autoLockMinutes=firstFinite(config.autoLockMinutes,30)??30;\n"
          if anchor not in s:
              raise SystemExit('operations config anchor missing')
          s=s.replace(anchor,anchor+"  const redundancy=config.schedulerRedundancy&&typeof config.schedulerRedundancy==='object'?config.schedulerRedundancy:null;\n",1)
          
          anchor2="  check('autopilot_enabled',enabled,'RED','Autopilot is disabled.');\n"
          if anchor2 not in s:
              raise SystemExit('operations Autopilot check anchor missing')
          insert="""  check('autopilot_enabled',enabled,'RED','Autopilot is disabled.');
          
            if(redundancy){
              const backupReady=redundancy.ready===true;
              const backupStatus=String(redundancy.status||'UNCONFIGURED').toUpperCase();
              const backupHealthy=backupReady&&['HEALTHY','STARTING','RECOVERY_RUNNING'].includes(backupStatus);
          
              if(!backupReady){
                severity=Math.max(severity,1);
                recoveryArmed=true;
                if(severity<2)mode='RECOVERY_ARMED';
                checks.push({key:'scheduler_redundancy',ok:false,level:'DEGRADED',message:'Backup heartbeat is not configured; GitHub Actions is currently the only scheduler.'});
                alerts.push('Scheduler redundancy setup is incomplete: configure the backup heartbeat secret and external cron.');
              }else if(insideWindow&&!backupHealthy){
                severity=Math.max(severity,1);
                recoveryArmed=true;
                if(severity<2)mode='RECOVERY_ARMED';
                checks.push({key:'scheduler_redundancy',ok:false,level:'DEGRADED',message:backupStatus==='STALE'?'Backup heartbeat has stopped checking in on schedule.':'Backup heartbeat is configured but has not completed its first check-in yet.'});
                alerts.push(backupStatus==='STALE'?'Backup scheduler heartbeat is stale.':'Backup scheduler is awaiting its first heartbeat check-in.');
              }else{
                checks.push({key:'scheduler_redundancy',ok:true,level:insideWindow?'OK':'SLEEP',message:backupReady?'Independent backup heartbeat is configured and available.':'Backup scheduler is outside its operating window.'});
              }
            }
          """
          s=s.replace(anchor2,insert,1)
          
          old="""  const nextAction=status==='RED'
              ?'Open Command Center diagnostics and restore the failed scheduler, persistence, or Autopilot dependency.'
              :quotaProtected
          """
          if old not in s:
              raise SystemExit('operations next-action anchor missing')
          new="""  const redundancyNeedsSetup=redundancy&&redundancy.ready!==true;
            const redundancyUnhealthy=redundancy&&redundancy.ready===true&&insideWindow&&!['HEALTHY','STARTING','RECOVERY_RUNNING'].includes(String(redundancy.status||'').toUpperCase());
          
            const nextAction=status==='RED'
              ?'Open Command Center diagnostics and restore the failed scheduler, persistence, or Autopilot dependency.'
              :redundancyNeedsSetup
                ?'Configure the independent backup heartbeat to restore redundant hands-off scheduling.'
                :redundancyUnhealthy
                  ?'Primary Autopilot may still be operating, but the backup heartbeat needs attention if it does not recover on its next check.'
              :quotaProtected
          """
          s=s.replace(old,new,1)
          
          old2="""    safeguards:{
                scheduler_recovery:'armed',
                persistent_state:storage.persistent===true,
          """
          if old2 not in s:
              raise SystemExit('operations safeguards anchor missing')
          new2="""    safeguards:{
                scheduler_recovery:redundancy&&redundancy.ready===true?'redundant':'primary-only',
                scheduler_redundancy:redundancy,
                persistent_state:storage.persistent===true,
          """
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          print('Operations Guardian redundancy staged.')
          PY

