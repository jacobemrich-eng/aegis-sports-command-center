name: AEGIS Autopilot

on:
  workflow_dispatch:

  schedule:
    # Wake AEGIS roughly every 15 minutes.
    # The backend decides whether research/odds work is actually due,
    # so every wake does not automatically spend API credits.
    - cron: "2,17,32,47 * * * *"

permissions:
  contents: read

concurrency:
  group: aegis-autopilot
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check Eastern-time operating window
        id: window
        shell: bash
        run: |
          HOUR=$(TZ=America/New_York date +%H)
          HOUR=$((10#$HOUR))

          echo "Eastern hour: $HOUR"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$HOUR" -ge 7 ] && [ "$HOUR" -lt 23 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wake AEGIS and run due Autopilot work
        if: steps.window.outputs.run == 'true'
        env:
          AEGIS_AUTOPILOT_SECRET: ${{ secrets.AEGIS_AUTOPILOT_SECRET }}
        shell: bash
        run: |
          if [ -z "$AEGIS_AUTOPILOT_SECRET" ]; then
            echo "AEGIS_AUTOPILOT_SECRET is not configured in GitHub Actions."
            exit 1
          fi

          curl \
            --fail \
            --show-error \
            --silent \
            --retry 4 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 180 \
            -X POST \
            "https://aegis-sports-command-center.onrender.com/api/autopilot/tick" \
            -H "Authorization: Bearer $AEGIS_AUTOPILOT_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"reason":"GitHub Actions scheduled autopilot"}'

          echo
          echo "AEGIS Autopilot tick completed successfully."

      - name: Outside operating window
        if: steps.window.outputs.run != 'true'
        run: echo "Outside the 7 AM–11 PM Eastern AEGIS operating window."
