          new_exec = "const stress=c.stress_test?` Stress ${c.stress_test.score}/100 (${c.stress_test.secondary_survivals}/4 adverse scenarios retain Secondary economics).`:''; const exec=`Execution: play-to ${fmtAmericanPrice(c.play_to)}, downgrade ${fmtAmericanPrice(c.downgrade_at)}, pass ${fmtAmericanPrice(c.pass_at)}; state ${c.execution_state||'—'}; freshness ${c.data_quality_grade||'—'}.${stress}`;"
          if old_exec not in engine:
