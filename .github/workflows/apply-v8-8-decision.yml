              'quality:c.decision_quality??0,stress_score:c.stress_test?.score??null,stress_secondary_survivals:c.stress_test?.secondary_survivals??null,stress_core_robust:c.stress_test?.core_robust??null,market_selection_score:c.market_selection_score??null,execution_state:c.execution_state||null,data_quality_grade:c.data_quality_grade||null,',
