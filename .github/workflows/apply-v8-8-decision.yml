      - name: Run full AEGIS validation
        run: npm run check

      - name: Commit tested v8.8 changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git diff --cached --check

          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Apply AEGIS v8.8 Decision Intelligence"
            git push origin HEAD:main
          fi

      - name: Verify live Render v8.8
        shell: bash
        env:
          HEALTH_URL: https://aegis-sports-command-center.onrender.com/api/health
          HOME_URL: https://aegis-sports-command-center.onrender.com/
          BUNDLE_URL: https://aegis-sports-command-center.onrender.com/app-v8_6.js?v=8.8.0
        run: |
          EXPECTED_SHA="$(git rev-parse HEAD)"
          EXPECTED_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_ENGINE="8.8.0-decision-intelligence"

          echo "Expected release: ${EXPECTED_VERSION}"
          echo "Expected engine: ${EXPECTED_ENGINE}"
          echo "Expected commit: ${EXPECTED_SHA}"

          for attempt in $(seq 1 24); do
            HEALTH="$(curl -fsS --max-time 20 "$HEALTH_URL" || true)"
            HOME="$(curl -fsS --max-time 20 "$HOME_URL" || true)"
            BUNDLE="$(curl -fsS --max-time 20 "$BUNDLE_URL" || true)"

            META="$(
              printf '%s' "$HEALTH" |
              node -e "
                let s='';
                process.stdin.on('data',d=>s+=d).on('end',()=>{
                  try{
                    const j=JSON.parse(s);
                    console.log([
                      j.release_version || '',
                      j.engine_version || '',
                      j.status || '',
                      j.deploy?.git_commit || '',
                      j.persistent_storage === true ? 'true' : 'false',
                      j.autopilot_enabled === true ? 'true' : 'false'
                    ].join('|'));
                  }catch{
                    console.log('|||||');
                  }
                });
              "
            )"

            IFS='|' read -r \
              LIVE_VERSION \
              LIVE_ENGINE \
              LIVE_STATUS \
              LIVE_SHA \
              LIVE_STORAGE \
              LIVE_AUTOPILOT \
              <<< "$META"

            UI_STATUS="$(
              printf '%s' "$HOME" |
              node -e "
                let s='';
                process.stdin.on('data',d=>s+=d).on('end',()=>{
                  const bad=/[ÃÂ�â]|[\u0080-\u009f]/u;
                  if(bad.test(s)) return console.log('MOJIBAKE');
                  if(!s.includes('v8.8 • DECISION INTELLIGENCE')) return console.log('STALE');
                  if(!s.includes('/app-v8_6.js?v=8.8.0')) return console.log('OLD_CACHE_KEY');
                  console.log('OK');
                });
              "
            )"

            BUNDLE_STATUS="$(
              printf '%s' "$BUNDLE" |
              node -e "
                let s='';
                process.stdin.on('data',d=>s+=d).on('end',()=>{
                  const bad=/[ÃÂ�â]|[\u0080-\u009f]/u;
                  if(bad.test(s)) return console.log('MOJIBAKE');
                  if(!s.includes('Stress survival')) return console.log('OLD_BUNDLE');
                  if(!s.includes('Decision ')) return console.log('NO_DECISION_META');
                  console.log('OK');
                });
              "
            )"

            echo "Attempt ${attempt}: release=${LIVE_VERSION:-unknown} engine=${LIVE_ENGINE:-unknown} status=${LIVE_STATUS:-unknown} commit=${LIVE_SHA:-unknown} storage=${LIVE_STORAGE:-unknown} autopilot=${LIVE_AUTOPILOT:-unknown} ui=${UI_STATUS:-unknown} bundle=${BUNDLE_STATUS:-unknown}"

            if \
              [ "$LIVE_VERSION" = "$EXPECTED_VERSION" ] && \
              [ "$LIVE_ENGINE" = "$EXPECTED_ENGINE" ] && \
              [ "$LIVE_STATUS" = "GREEN" ] && \
              [ "$LIVE_SHA" = "$EXPECTED_SHA" ] && \
              [ "$LIVE_STORAGE" = "true" ] && \
              [ "$LIVE_AUTOPILOT" = "true" ] && \
              [ "$UI_STATUS" = "OK" ] && \
              [ "$BUNDLE_STATUS" = "OK" ]
            then
              echo "AEGIS v8.8 Decision Intelligence production verification passed."
              exit 0
            fi

            sleep 15
          done

          echo "Production did not prove the expected v8.8 Decision Intelligence release."
          exit 1
