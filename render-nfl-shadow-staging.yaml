services:
  - type: web
    name: aegis-nfl-shadow-staging
    runtime: node
    plan: free
    branch: nfl-shadow-staging
    buildCommand: npm install && npm run check
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: AEGIS_DEPLOYMENT_ENV
        value: nfl-shadow-staging
      - key: AEGIS_STATE_ID
        value: nfl-shadow-staging
      - key: AEGIS_AUTOPILOT_ENABLED
        value: "false"
      - key: AEGIS_AUTOPILOT_SPORTS
        value: none
      - key: AEGIS_RELEASE_SPORTS
        value: none
      - key: NFL_SIM_ENABLED
        value: "true"
      - key: NFL_SIM_SHADOW_ONLY
        value: "true"
      - key: NCAAF_SIM_ENABLED
        value: "false"
      - key: NCAAF_SIM_SHADOW_ONLY
        value: "true"
      - key: MLB_SIM_ENABLED
        value: "false"
      - key: MLB_SIM_SHADOW_ONLY
        value: "true"
      - key: AEGIS_NEW_ENGINE_AUTO_RELEASE
        value: "false"
      - key: AEGIS_SHADOW_INGEST_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: AEGIS_ACCESS_PIN
        sync: false
      - key: AEGIS_SESSION_SECRET
        sync: false
