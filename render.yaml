services:
  - type: web
    name: aegis-sports-command-center
    runtime: node
    plan: free
    buildCommand: npm install && npm run check
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: ODDS_API_KEY
        sync: false
      - key: CFBD_API_KEY
        sync: false
      - key: AEGIS_ACCESS_PIN
        sync: false
      - key: AEGIS_SESSION_SECRET
        sync: false
      - key: AEGIS_AUTOPILOT_SECRET
        sync: false
      - key: AEGIS_HEARTBEAT_SECRET
        sync: false
      - key: AEGIS_HEARTBEAT_STALE_MINUTES
        value: "35"
      - key: AEGIS_HEARTBEAT_PROBE_FRESH_MINUTES
        value: "25"
      - key: AEGIS_HEARTBEAT_DEBOUNCE_MS
        value: "15000"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      # Legacy fallback only. Prefer SUPABASE_SECRET_KEY (sb_secret_...).
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AEGIS_STATE_ID
        value: main
      - key: AEGIS_TIMEZONE
        value: America/New_York
      - key: AEGIS_AUTOPILOT_ENABLED
        value: "true"
      - key: AEGIS_AUTOPILOT_SPORTS
        value: baseball_mlb,americanfootball_ncaaf
      - key: AEGIS_RELEASE_SPORTS
        value: baseball_mlb,americanfootball_ncaaf
      - key: AEGIS_DAILY_ODDS_CREDIT_BUDGET
        value: "18"
      - key: AEGIS_MONTHLY_ODDS_CREDIT_BUDGET
        value: "450"
      - key: AEGIS_MAX_SPORTS_PER_TICK
        value: "2"
      - key: AEGIS_MAX_FULL_ODDS_REFRESHES_PER_SPORT_DAY
        value: "2"
      - key: AEGIS_MAX_TARGETED_REFRESHES_PER_SPORT_DAY
        value: "3"
      - key: AEGIS_AUTOPILOT_DEEP_CREDIT_CAP
        value: "3"
      - key: AEGIS_AUTOPILOT_DEEP_WINDOW_HOURS
        value: "4"
      - key: AEGIS_AUTO_LOCK_MINUTES
        value: "30"
      - key: AEGIS_GRADE_DELAY_HOURS
        value: "2"
      - key: ODDS_BOOKMAKERS
        value: hardrockbet_fl,fanduel,draftkings,bovada,betmgm,espnbet,fanatics
      - key: MAX_SCAN_GAMES
        value: "15"
      - key: MAX_DEEP_MARKET_GAMES
        value: "4"
      - key: MAX_DEEP_MARKET_CREDITS
        value: "10"
      - key: ODDS_CACHE_TTL_MS
        value: "120000"
      - key: MIN_ODDS_REFRESH_MS
        value: "60000"
      - key: ODDS_QUOTA_RESERVE
        value: "35"
