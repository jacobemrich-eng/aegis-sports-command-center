services:
  - type: web
    name: aegis-sports-command-center
    runtime: node
    plan: free
    buildCommand: npm install && npm test
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: ODDS_API_KEY
        sync: false
      - key: CFBD_API_KEY
        sync: false
      - key: AEGIS_ACCESS_PIN
        sync: false
      - key: AEGIS_SESSION_SECRET
        sync: false
      - key: ODDS_BOOKMAKERS
        value: hardrockbet_fl,fanduel,draftkings,bovada,betmgm,espnbet,fanatics
      - key: MAX_SCAN_GAMES
        value: "15"
      - key: MAX_DEEP_MARKET_GAMES
        value: "4"
      - key: MAX_DEEP_MARKET_CREDITS
        value: "10"
      - key: ODDS_CACHE_TTL_MS
        value: "120000"
      - key: MIN_ODDS_REFRESH_MS
        value: "60000"
      - key: ODDS_QUOTA_RESERVE
        value: "35"
