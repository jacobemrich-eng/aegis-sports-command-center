services:
  - type: web
    name: aegis-sports-command-center
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: ODDS_REGION
        value: us
      - key: ODDS_API_KEY
        sync: false
